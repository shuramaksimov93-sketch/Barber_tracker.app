<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Barber Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f0f5;--bg2:#e4e4ec;--card:#fff;
  --t1:#18181b;--t2:#52525b;--t3:#a1a1aa;
  --blue:#2563eb;--bl:rgba(37,99,235,.1);--bm:rgba(37,99,235,.18);--ac-d:#1d4ed8;--ac-l:#3b82f6;
  --green:#16a34a;--gl:rgba(22,163,74,.1);
  --red:#dc2626;--rl:rgba(220,38,38,.09);
  --orange:#ea580c;--ol:rgba(234,88,12,.1);
  --purple:#7c3aed;--pl:rgba(124,58,237,.1);
  --sep:rgba(0,0,0,.07);--sep2:rgba(0,0,0,.04);
  --r-xl:22px;--r-lg:16px;
  --sh-s:0 1px 4px rgba(0,0,0,.07);
  --sh:0 4px 18px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
  --sh-xl:0 24px 60px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.1);
  /* primary (confirm) buttons: ink black */
  --btn:#0b0b0d;--btn-fg:#fff;--btn-ring:0 6px 18px rgba(0,0,0,.22);
  /* keypad / sheet surfaces */
  --k1:#fff;--k2:#e4e4ea;--s1:transparent;--k-sh:0 1px 3px rgba(0,0,0,.1);
  /* confirm dialogs */
  --dlg:rgba(255,255,255,.98);--dlg-sep:rgba(0,0,0,.09);--dlg-t:#18181b;
  color-scheme:light dark;
}
@media(prefers-color-scheme:dark){:root{
  --btn:#000;--btn-ring:inset 0 0 0 1px rgba(255,255,255,.22),0 6px 18px rgba(0,0,0,.5);
  --k1:#2c2c2e;--k2:#3a3a3c;--s1:#1c1c1e;--k-sh:none;
  --dlg:var(--dlg);--dlg-sep:rgba(255,255,255,.08);--dlg-t:#fff;
  --bg:#0f0f12;--bg2:#1c1c22;--card:#1e1e26;
  --t1:#f4f4f5;--t2:#a1a1aa;--t3:#52525b;
  --sep:rgba(255,255,255,.08);--sep2:rgba(255,255,255,.04);
  --sh-s:0 1px 4px rgba(0,0,0,.4);--sh:0 4px 18px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.3);
  --sh-xl:0 24px 60px rgba(0,0,0,.7),0 8px 24px rgba(0,0,0,.4);
}}
@media(prefers-color-scheme:dark){:root.oled{--bg:#000;--bg2:#101013;--card:#101014;--s1:#08080a;--k1:#1a1a1d;--k2:#2a2a2d}}
/* APPEARANCE */
.sw-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--sep) inset;cursor:pointer;padding:0;transition:transform .15s}
.sw.on{border-color:var(--card);box-shadow:0 0 0 2.5px var(--t1);transform:scale(1.08)}
.td-rec{display:flex;align-items:center;gap:8px;background:linear-gradient(110deg,rgba(234,179,8,.18),rgba(234,179,8,.06));border:1px solid rgba(234,179,8,.35);border-radius:var(--r-lg);padding:9px 14px;margin:-2px 0 10px;font-size:13px;font-weight:800;color:var(--t1);animation:recIn .5s cubic-bezier(.34,1.4,.64,1) both}
.td-rec span{font-size:18px}
@keyframes recIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.td-quick{width:100%;border:none;border-radius:var(--r-lg);padding:14px;margin:0 0 10px;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--green),#22c55e);box-shadow:0 6px 18px rgba(22,163,74,.3);cursor:pointer}
.td-quick small{display:block;font-size:11.5px;font-weight:600;opacity:.88;margin-top:2px}
.td-tax,.td-due,.td-bd{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh);padding:11px 14px;margin:-2px 0 10px;font-size:13px;color:var(--t2);font-weight:600;cursor:pointer}
.td-tax b,.td-due b{color:var(--t1);font-weight:800}
.td-tax small,.td-due small{display:block;font-size:11.5px;color:var(--t3);font-weight:600;margin-top:1px}
.td-tax .amt{font-size:17px;font-weight:800;color:var(--t1);white-space:nowrap}
.td-due.soon{background:var(--ol);box-shadow:none}
.td-due.today{background:var(--rl);box-shadow:none}
.td-bd{cursor:default;padding:9px 14px}
.td-bd .bdn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-bd button{border:none;background:var(--gl);color:var(--green);font-weight:800;font-size:12.5px;border-radius:10px;padding:7px 11px;font-family:inherit;cursor:pointer;flex:none}
.cf-bd{display:flex;gap:8px}.cf-bd select{flex:1;min-width:0;padding:12px 10px;border:1.5px solid var(--sep);border-radius:14px;background:var(--bg2);font-size:15px;font-family:inherit;-webkit-appearance:none;appearance:none}
.td-srch{flex:none;margin-left:auto;margin-right:10px;align-self:stretch;width:46px;border:none;background:var(--card);color:var(--t2);box-shadow:var(--sh);border-radius:18px;display:grid;place-items:center;cursor:pointer}
.td-srch:active{transform:scale(.95)}
.sr-in{width:100%;border:none;outline:none;background:var(--bg2);border-radius:14px;padding:13px 16px;font-size:17px;font-weight:600;font-family:inherit;color:var(--t1);-webkit-appearance:none;margin-bottom:12px}
.sr-h{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);margin:12px 4px 6px}
.sr-r{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:14px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.sr-r .a{flex:1;min-width:0}.sr-r .a b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-r .a span{display:block;font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-e{text-align:center;color:var(--t3);padding:22px 8px;font-size:13.5px}
.yoy-b{display:flex;align-items:flex-end;gap:3px;height:92px}
.yoy-b>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.yoy-b .pr{display:flex;align-items:flex-end;gap:2px;width:100%;flex:1;justify-content:center}
.yoy-b i{display:block;width:42%;max-width:11px;border-radius:3px 3px 1px 1px}
.yoy-b i.a{background:var(--sep);box-shadow:inset 0 0 0 1px var(--t3)}
.yoy-b i.b{background:var(--blue)}
.yoy-b span{font-size:9px;font-weight:700;color:var(--t3)}
.cal-hint{margin-top:10px;text-align:center;font-size:11.5px;font-weight:600;color:var(--t3);line-height:1.35}
.or-est{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:var(--ol);color:var(--orange);font-size:13px;font-weight:700;line-height:1.4}
.or-est:empty{display:none}
.tour-ic{font-size:54px;text-align:center;margin:8px 0 6px}
.tour-h{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.3px}
.tour-t{font-size:14.5px;line-height:1.55;color:var(--t2);text-align:center;margin:8px 8px 14px}
.tour-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--sep);transition:all .2s}
.tour-dots i.on{background:var(--blue);width:20px;border-radius:4px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body.sheet-open,body.modal-open{overflow:hidden;position:fixed;width:100%;height:100%;}
input,textarea,button,select{font-family:inherit;color:var(--t1)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input,textarea{background:transparent;color:var(--t1);-webkit-text-fill-color:var(--t1)}
input::placeholder,textarea::placeholder{color:var(--t3);-webkit-text-fill-color:var(--t3)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.au{animation:fadeUp .32s cubic-bezier(.34,1.2,.64,1) both}
.au2{animation:fadeUp .32s .06s cubic-bezier(.34,1.2,.64,1) both}
.au3{animation:fadeUp .32s .12s cubic-bezier(.34,1.2,.64,1) both}

/* NAV */
.nav{position:sticky;top:0;z-index:90;padding:12px 16px 10px;background:rgba(240,240,245,.88);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--sep)}
@media(prefers-color-scheme:dark){.nav{background:rgba(15,15,18,.9)}}
.nav-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-logo{font-size:17px;font-weight:900;letter-spacing:-.6px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.nav-logo em{font-style:normal;color:var(--blue)}
.lang-btn{border:none;background:none;cursor:pointer;font-size:16px;padding:4px;flex-shrink:0}

.main{max-width:700px;margin:0 auto;padding:18px 14px 110px}
.slabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);padding:0 4px;margin-bottom:7px;margin-top:22px}
.slabel:first-child{margin-top:0}
.card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh);overflow:hidden}

/* LOC GRID */
.loc-grid{display:flex;flex-wrap:wrap;gap:7px}
.loc-pill{flex:1;min-width:72px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-s);border:1.5px solid transparent;padding:12px 6px 10px;text-align:center;cursor:pointer;transition:all .22s cubic-bezier(.34,1.2,.64,1);position:relative}
.loc-pill:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.loc-pill.active{transform:translateY(-1px);box-shadow:var(--sh)}
.lp-icon{font-size:17px;line-height:1;margin-bottom:3px}
.lp-name{font-size:9.5px;font-weight:700;color:var(--t2);line-height:1.2}
.reform-badge{position:absolute;top:3px;right:3px;font-size:7px;font-weight:800;background:var(--purple);color:white;border-radius:4px;padding:1px 3px}

/* DATE FIELD */
.date-field{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;cursor:pointer;transition:background .15s;border-radius:var(--r-xl)}
.date-field:hover{background:var(--sep2)}
.df-l{display:flex;align-items:center;gap:9px}
.df-icon{width:30px;height:30px;border-radius:8px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.df-lbl{font-size:15px;font-weight:600}
.df-r{display:flex;align-items:center;gap:5px}
.df-val{font-size:14px;font-weight:700;color:var(--t1)}
.df-dot{width:7px;height:7px;border-radius:50%;display:none}
.df-dot.on{display:block}
.df-chev{color:var(--t3);font-size:11px;transition:transform .22s}
.date-field.open .df-chev{transform:rotate(180deg)}
.cal-drop{max-height:0;overflow:hidden;opacity:0;transition:max-height .38s cubic-bezier(.4,0,.2,1),opacity .25s ease;border-top:1px solid transparent}
.cal-drop.open{max-height:420px;opacity:1;border-top-color:var(--sep)}
.cal-inner{padding:11px 11px 13px}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.cal-nav{width:31px;height:31px;border-radius:50%;border:none;background:var(--bg2);color:var(--t1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-nav:hover{background:var(--bl);color:var(--blue)}
.cal-nav:active{transform:scale(.9)}
.cal-ml{font-size:14px;font-weight:700}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.cal-dw{font-size:10px;font-weight:700;color:var(--t3);text-align:center;padding:3px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:500;position:relative;border:none;background:none;color:var(--t1);transition:all .18s cubic-bezier(.34,1.2,.64,1)}
.cd:hover:not(.cdo){background:var(--bg2);transform:scale(1.08)}
.cdo{color:var(--t3);cursor:default}
.cd-today{font-weight:800;color:var(--blue)}
.cd-today::before{content:'';position:absolute;inset:2px;border-radius:50%;border:1.5px solid var(--blue);opacity:.3}
.cd-sel{background:var(--blue)!important;color:white!important;font-weight:800;transform:scale(1.1);box-shadow:0 3px 14px rgba(37,99,235,.4)}
.cd-sel::before{display:none}
/* Calendar colored dots */
.cd-dot2{display:none;width:5px;height:5px;border-radius:50%;position:absolute;bottom:2px;left:50%;transform:translateX(-50%)}
.cd-has .cd-dot2{display:block}
/* Multi-loc: two mini dots */
.cd-dot2-multi{display:none;position:absolute;bottom:2px;left:50%;transform:translateX(-50%);gap:2px;flex-direction:row}
.cd-has-multi .cd-dot2-multi{display:flex}
.cd-sel .cd-dot2,.cd-sel .cd-dot2-multi{opacity:.8}

/* FORM */
.form-group{border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh)}
.frow{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--card);border-bottom:1px solid var(--sep);transition:background .15s;cursor:pointer;-webkit-user-select:none;user-select:none}
.frow:last-child{border-bottom:none}
.frow:active{background:var(--sep2)}
.frow-l{display:flex;align-items:center;gap:9px;flex:1;pointer-events:none}
.fi{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.frow-lbl{font-size:15px;font-weight:500}

.ana-seg{display:flex;gap:4px;background:var(--bg2);border-radius:11px;padding:3px}
.ana-seg button{border:none;background:none;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--t2);padding:5px 9px;border-radius:8px;cursor:pointer}
.ana-seg button.on{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.ana-cols{display:flex;gap:6px;align-items:flex-end;height:118px;padding:0 2px}
.ana-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.ana-col .v{font-size:10.5px;font-weight:800;color:var(--t2);margin-bottom:3px;white-space:nowrap}
.ana-col .b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--blue);min-height:3px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.ana-col.best .b{background:var(--green)}.ana-col.weak .b{background:var(--orange)}
.ana-col.few .b{opacity:.35}.ana-col.few .v{opacity:.5}
.ana-lab{display:flex;gap:6px;padding:6px 2px 0}
.ana-lab div{flex:1;text-align:center;min-width:0}
.ana-lab b{display:block;font-size:11.5px;font-weight:800}
.ana-lab span{display:block;font-size:10px;color:var(--t3);font-weight:600;margin-top:1px}
.ana-note{display:flex;gap:10px;margin-top:12px}
.hm{display:flex;flex-direction:column;gap:4px}
.hm-r{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.hm-r>i{font-style:normal;font-size:15px;text-align:center}
.hm-h span{font-size:10.5px;font-weight:800;color:var(--t3);text-align:center}
.hm-c{height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.hm-e{background:var(--bg2);color:var(--t3);font-weight:600}
.tod{display:flex;gap:3px;align-items:flex-end;height:96px}
.tod-c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.tod-c .b{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--blue);opacity:.55}
.tod-c.best .b{background:var(--green);opacity:1}
.tod-c span{font-size:10px;font-weight:700;color:var(--t3)}
.ana-note div{flex:1;background:var(--bg2);border-radius:12px;padding:9px 11px;font-size:11px;font-weight:600;color:var(--t3)}
.ana-note b{display:block;font-size:13.5px;font-weight:800;color:var(--t1);margin-top:2px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .55s ease,transform .65s cubic-bezier(.2,.8,.2,1)}
.rv.rv-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
.frow-r{display:flex;align-items:center;gap:4px;pointer-events:none}
.fval{font-size:15px;font-weight:700;color:var(--t1);min-width:50px;text-align:right}
.fval.empty{color:var(--t3);font-weight:400;padding:0;text-align:right}
.funit{font-size:12px;color:var(--t3);font-weight:600}
.frow-note{align-items:flex-start;padding-top:13px;padding-bottom:13px;cursor:default}
.fnote-input{border:none;outline:none;background:none;font-size:14px;font-weight:400;color:var(--t1);-webkit-text-fill-color:var(--t1);width:175px;resize:none;height:38px;line-height:1.4;text-align:right;cursor:text;pointer-events:all}
.fnote-input::placeholder{color:var(--t3);-webkit-text-fill-color:var(--t3)}

/* EDIT BANNER */
.eb{border-radius:var(--r-lg);padding:11px 14px;background:linear-gradient(135deg,rgba(234,88,12,.13),rgba(234,88,12,.06));border:1.5px solid rgba(234,88,12,.25);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;animation:scaleIn .25s cubic-bezier(.34,1.2,.64,1)}
.eb-l{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--orange)}
.eb-btns{display:flex;gap:5px}
.eb-btn{font-size:12px;font-weight:700;border:none;border-radius:8px;padding:5px 11px;cursor:pointer;font-family:inherit;transition:all .15s}
.eb-reset{background:var(--rl);color:var(--red)}
.eb-move{background:var(--sep);color:var(--t1)}
.bk-ban{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-s);border-left:4px solid var(--orange)}
.bk-ban .bk-t{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.35;color:var(--t1)}
.bk-ban .bk-t small{display:block;font-size:11.5px;font-weight:600;color:var(--t3);margin-top:2px}
.bk-ban button{border:none;font-family:inherit;font-size:13px;font-weight:800;border-radius:12px;padding:9px 13px;cursor:pointer;flex:none}
.bk-ban .bk-go{background:var(--btn);color:var(--btn-fg);box-shadow:var(--btn-ring)}
.bk-ban .bk-x{background:none;color:var(--t3);padding:9px 6px}
.date-row{display:flex;align-items:center}
.date-row .date-field{flex:1;min-width:0}
.date-row .df-lbl{display:none}
.date-row .df-val{white-space:nowrap}
.date-row .date-field{padding-left:6px;padding-right:6px}
.dnav{flex:none;width:46px;height:50px;border:none;background:none;color:var(--t2);font-size:28px;font-weight:300;font-family:inherit;cursor:pointer;line-height:1;-webkit-tap-highlight-color:transparent}
.dnav:active{color:var(--t1);background:var(--sep2)}
.lp-rec{font-size:10.5px;font-weight:800;color:var(--green);margin-top:3px;white-space:nowrap}
.eb-cancel{background:var(--sep);color:var(--t2)}

/* PREVIEW */
.prev-strip{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh);padding:14px 17px;display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;align-items:center}
.pv-sep{height:28px;background:var(--sep)}
.pv-item{text-align:center}
.pv-val{font-size:17px;font-weight:800;letter-spacing:-.5px}
.pv-lbl{font-size:10px;color:var(--t3);margin-top:1px;font-weight:600}
.pv-val.cb{color:var(--t1)}.pv-val.cg{color:var(--green)}.pv-val.cp{color:var(--purple)}
/* DAY SUMMARY (entry form) */
.dsum{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh);padding:16px 17px 14px;overflow:hidden}
.ds-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ds-main{min-width:0}
.ds-lbl{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.2px;text-transform:uppercase}
.ds-big{white-space:nowrap;font-size:clamp(28px,9vw,34px);line-height:1.05;font-weight:800;letter-spacing:-1.2px;color:var(--t1);margin-top:3px;font-variant-numeric:tabular-nums}
.ds-big.pos{color:var(--green)}
.ds-cmp{flex:0 1 auto;text-align:right;font-size:11px;font-weight:600;color:var(--t3);line-height:1.35;max-width:48%}
.ds-cmp small{display:block;font-size:11px;font-weight:600}.ds-cmp b{display:block;font-size:13px;font-weight:800}
.ds-cmp .up{color:var(--green)}.ds-cmp .dn{color:var(--red)}
.ds-bar{display:flex;height:8px;border-radius:99px;background:var(--sep);overflow:hidden;margin:14px 0 12px;gap:2px}
.ds-bar i{display:block;height:100%;width:0;transition:width .35s cubic-bezier(.3,.8,.3,1);border-radius:99px}
.ds-bar .b1,.dot.d1{background:var(--blue)}
.ds-bar .b2,.dot.d2{background:var(--purple)}
.ds-bar .b3,.dot.d3{background:var(--green)}
.ds-rows{display:flex;flex-direction:column;gap:7px}
.ds-r{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--t2);font-weight:600}
.ds-r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-r b{white-space:nowrap;color:var(--t1);font-weight:800;font-variant-numeric:tabular-nums}
.ds-r .dot{width:9px;height:9px;border-radius:50%;flex:none}
.ds-r.zero{opacity:.45}
.ds-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:13px}
.ds-k{background:var(--bg2,rgba(120,120,128,.1));border-radius:12px;padding:8px 6px;text-align:center}
.ds-k b{display:block;font-size:15px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.ds-k span{display:block;line-height:1.2;font-size:10px;font-weight:600;color:var(--t3);margin-top:1px}
.ds-inv{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid var(--sep);font-size:13px;font-weight:600;color:var(--t2)}
.ds-inv b{white-space:nowrap;font-size:15px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums}


.save-btn{width:100%;padding:15px;border:none;border-radius:var(--r-xl);background:var(--btn);color:var(--btn-fg);font-size:15px;font-weight:800;cursor:pointer;transition:all .22s cubic-bezier(.34,1.2,.64,1);box-shadow:var(--btn-ring)}
.save-btn:hover{transform:translateY(-1px)}
.save-btn:active{transform:scale(.98)}
.save-btn.emode{background:var(--orange);box-shadow:0 4px 20px rgba(234,88,12,.3)}

/* PERIOD TABS */
.ptabs{display:flex;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-s);padding:3px;gap:2px;margin-bottom:13px}
.ptab{flex:1;padding:7px;border-radius:12px;text-align:center;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--t2);border:none;background:none;cursor:pointer;transition:all .2s}
.ptab.active{background:var(--btn);color:var(--btn-fg);box-shadow:var(--btn-ring)}

/* MONTH NAV */
.mnav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.mnav-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);color:var(--t1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mnav-btn:hover{background:var(--bl);color:var(--blue)}
.mnav-btn:active{transform:scale(.9)}
.mnav-title{font-size:15px;font-weight:800;letter-spacing:-.3px;background:none;border:none;cursor:pointer;color:var(--t1);display:flex;align-items:center;gap:4px;font-family:inherit}
.mnav-title::after{content:'▾';font-size:10px;color:var(--blue);opacity:.7}

/* STAT CARDS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh);padding:15px;transition:transform .2s}
.sc:hover{transform:translateY(-1px)}
.sc.full{grid-column:1/-1}
.sc.hero{background:linear-gradient(135deg,var(--ac-d),var(--blue),var(--ac-l))}
.sc.hero-p{background:linear-gradient(135deg,#5b21b6,#7c3aed,#8b5cf6)}
.sc.hero .sc-lbl,.sc.hero-p .sc-lbl{color:rgba(255,255,255,.75)}
.sc-val{font-size:21px;font-weight:800;letter-spacing:-1px;color:var(--t1)}
.sc-val.cb{color:var(--blue)}.sc-val.cg{color:var(--green)}.sc-val.cp{color:var(--purple)}
.sc.hero .sc-val,.sc.hero-p .sc-val{color:white}
.sc-lbl{font-size:11px;color:var(--t2);margin-top:2px;font-weight:600}

/* REFORM SECTION */
.reform-sec{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(124,58,237,.05));border:1.5px solid rgba(124,58,237,.2);border-radius:var(--r-xl);padding:15px 17px;margin-bottom:11px}
.reform-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.reform-title{font-size:14px;font-weight:800;color:var(--purple);display:flex;align-items:center;gap:7px}
.reform-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.rst{text-align:center;background:rgba(124,58,237,.07);border-radius:11px;padding:9px 5px}
.rst-val{font-size:14px;font-weight:800;color:var(--purple);letter-spacing:-.5px}
.rst-lbl{font-size:9.5px;color:var(--t3);margin-top:1px;font-weight:600}

/* LOC ROWS */
.loc-rows{overflow:hidden}
.loc-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--sep);transition:background .15s}
.loc-row:last-child{border-bottom:none}
.loc-row:hover{background:var(--sep2)}
.lr-l{display:flex;align-items:center;gap:8px}
.lr-badge{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lr-name{font-size:14px;font-weight:700}
.lr-sub{font-size:11px;color:var(--t2);margin-top:1px}
.lr-amt{font-size:14px;font-weight:800}

/* ENTRIES TABLE */
.etbl-hdr{display:grid;grid-template-columns:54px 1fr 76px 76px 50px;padding:7px 16px;border-bottom:1px solid var(--sep);gap:4px}
.etbl-hdr span{font-size:9.5px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.erow{display:grid;grid-template-columns:54px 1fr 76px 76px 50px;padding:10px 16px;border-bottom:1px solid var(--sep);gap:4px;align-items:center;cursor:pointer;transition:background .15s}
.erow:last-child{border-bottom:none}
.erow:hover{background:rgba(37,99,235,.03)}
.er-date{font-size:12px;color:var(--t2);font-weight:700}
.er-loc{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.er-num{font-size:12px;font-weight:700;text-align:right}
.er-num.g{color:var(--green)}.er-num.p{color:var(--purple)}
.er-cl{font-size:11px;color:var(--t2);text-align:right}

/* YEAR BARS */
.ybars{padding:12px 16px 14px}
.ybar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ybar-lbl{font-size:11px;font-weight:700;color:var(--t2);width:26px;flex-shrink:0}
.ybar-track{flex:1;height:25px;background:var(--bg2);border-radius:8px;overflow:hidden}
.ybar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--ac-l));display:flex;align-items:center;justify-content:flex-end;padding-right:7px;transition:width .7s cubic-bezier(.34,1.1,.64,1)}
.ybar-fill span{font-size:10px;font-weight:800;color:white;white-space:nowrap}
.ybar.top .ybar-fill{background:linear-gradient(90deg,#16a34a,#4ade80)}
.ybar-empty{font-size:10.5px;color:var(--t3);line-height:25px;padding-left:6px}

/* INVOICE */

/* ── receipt (modern ticket) ── */
.rc{position:relative;margin:4px 2px 16px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.12))}
.rc-paper{position:relative;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:22px 20px 40px;color:var(--t1);
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 0/18px 100%;mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 0/18px 100%}
.rc.rc-anim .rc-paper{animation:rcPrint .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes rcPrint{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.rc-top{display:flex;align-items:center;justify-content:space-between}
.rc-brand{font-size:26px;font-weight:900;letter-spacing:-1px}
.rc-brand i{font-style:normal;color:var(--blue)}
.rc-chip{font-size:11.5px;font-weight:800;color:var(--blue);background:var(--bl);border-radius:20px;padding:5px 11px;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.rc-title{font-size:15px;font-weight:800;margin-top:14px;letter-spacing:-.2px}
.rc-meta2{font-size:12.5px;color:var(--t3);font-weight:600;margin-top:3px}
.rc-div{border:0;border-top:1.5px dashed rgba(128,128,140,.35);margin:16px 0}
.rc-sec{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 0 6px}
.rc-sec s{width:10px;height:10px;border-radius:50%;flex:none;text-decoration:none}
.rc-ln{display:flex;align-items:baseline;gap:7px;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.rc-ln span:first-child{flex:none;max-width:62%;color:var(--t2);font-weight:500}
.rc-ln i{flex:1;min-width:10px;border-bottom:1.5px dotted rgba(128,128,140,.4);transform:translateY(-3px)}
.rc-ln b{flex:none;font-weight:700;white-space:nowrap}
.rc-gap{height:14px}
.rc-total{position:relative;margin-top:18px;padding:14px 2px 74px;border-top:4px double rgba(128,128,140,.45);border-bottom:1.5px dashed rgba(128,128,140,.35)}
.rc-total span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--t3)}
.rc-total b{display:block;font-size:34px;font-weight:900;letter-spacing:-1.4px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
.rc-stamp{position:absolute;right:6px;bottom:18px;cursor:pointer;transform:rotate(-9deg);color:#c0392b;border:2.5px solid currentColor;border-radius:9px;padding:6px 11px 5px;text-align:center;
  box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3.5px currentColor;opacity:.86;line-height:1.15}
.rc-stamp i{display:block;font-style:normal;font-size:15px;font-weight:900;letter-spacing:2.2px;padding-left:2px}
.rc-stamp small{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.6px;margin-top:2px;opacity:.9}
@media(prefers-color-scheme:dark){.rc-stamp{color:#ff6f61}}
.rc-cut{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:var(--t3);margin:20px 0 14px}
.rc-cut::before,.rc-cut::after{content:'';flex:1;border-top:1.5px dashed rgba(128,128,140,.35)}
.rc-note{font-size:12.5px;line-height:1.5;padding:2px 0;color:var(--t2)}
.rc-note b{font-weight:800;color:var(--t1);margin-right:6px}
.rc-bar{height:30px;width:62%;margin:24px auto 7px;opacity:.5;background:repeating-linear-gradient(90deg,var(--t1) 0 2px,transparent 2px 4px,var(--t1) 4px 5px,transparent 5px 8px,var(--t1) 8px 11px,transparent 11px 13px,var(--t1) 13px 14px,transparent 14px 16px)}
.rc-code{text-align:center;font-size:10.5px;letter-spacing:2.5px;color:var(--t3);font-weight:600;font-variant-numeric:tabular-nums}
.rc-thx{text-align:center;font-size:14px;font-weight:800;margin-top:14px}
.rc-print{text-align:center;font-size:11px;color:var(--t3);font-weight:600;margin-top:3px}

/* MONTH PICKER */
.picker-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.picker-ov.open{opacity:1;pointer-events:all}
.picker-box{background:var(--card);border-radius:26px;padding:19px;width:310px;box-shadow:var(--sh-xl);transform:scale(.94) translateY(10px);transition:transform .28s cubic-bezier(.34,1.2,.64,1)}
.picker-ov.open .picker-box{transform:scale(1) translateY(0)}
.py-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.py-nav{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);color:var(--t1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.py-nav:hover{background:var(--bl);color:var(--blue)}
.py-lbl{font-size:17px;font-weight:900}
.pm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pm{padding:10px 4px;border-radius:12px;text-align:center;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s cubic-bezier(.34,1.2,.64,1);border:none;background:var(--bg2);color:var(--t1);position:relative}
.pm:hover{background:var(--bg2);color:var(--t1);transform:translateY(-1px)}
.pm.active{background:var(--btn);color:var(--btn-fg);box-shadow:var(--btn-ring)}
.pm.hd::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--green)}
.pm.active::after{background:rgba(255,255,255,.7)}
.picker-close{display:block;width:100%;margin-top:11px;padding:11px;border:none;border-radius:12px;background:var(--bg2);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--t2);transition:all .15s}

/* BOTTOM SHEET */
.sheet-ov{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.sheet-ov.open{opacity:1;pointer-events:all}
.sheet-box{background:var(--card);border-radius:26px 26px 0 0;width:100%;max-width:480px;padding-bottom:max(env(safe-area-inset-bottom),16px);transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);box-shadow:var(--sh-xl)}
.sheet-ov.open .sheet-box{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--sep);margin:10px auto 0;cursor:grab}
.sheet-title{text-align:center;font-size:12px;font-weight:700;color:var(--t2);padding:8px 0 2px;text-transform:uppercase;letter-spacing:.6px}

/* ═══════════════════════════════════════
   CALCULATOR — Liquid Glass
═══════════════════════════════════════ */

/* Sheet becomes glass container */
.sheet-box{
  background:rgba(10,10,16,.82) !important;
  backdrop-filter:saturate(180%) blur(40px) !important;
  -webkit-backdrop-filter:saturate(180%) blur(40px) !important;
  border:1px solid rgba(255,255,255,.07);
  border-bottom:none;
  box-shadow:0 -8px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1) !important;
}
.sheet-handle{background:rgba(255,255,255,.18) !important;}
.sheet-title{color:rgba(255,255,255,.45) !important;letter-spacing:.8px;}

/* Display area — deep glass */
.calc-wrap{
  padding:0 0 4px;
  background:transparent;
  border-radius:0 0 26px 26px;
}
.calc-display{
  padding:14px 22px 16px;
  text-align:right;
  min-height:120px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 100%);
  border-bottom:1px solid rgba(255,255,255,.05);
  position:relative;
}
/* Subtle top-left light refraction on display */
.calc-display::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
}
.calc-history{font-size:13px;font-weight:400;color:rgba(255,255,255,.28);min-height:18px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;direction:rtl;text-align:left;padding-bottom:2px;}
.calc-history::-webkit-scrollbar{display:none}
.calc-expr-line{font-size:15px;font-weight:500;color:rgba(255,255,255,.45);min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;}
.calc-main-num{
  font-size:64px;font-weight:400;letter-spacing:-2.5px;
  color:#fff;line-height:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* Pad backgrounds — transparent so glass shows through */
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;padding:12px 14px 8px;background:transparent;}
.calc-pad-bottom{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;padding:0 14px 16px;background:transparent;}

/* ── LIQUID GLASS BUTTONS ── */
.ck{
  border:none;cursor:pointer;font-family:inherit;
  border-radius:50%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:500;
  width:100%;line-height:1;
  -webkit-user-select:none;user-select:none;
  position:relative;overflow:hidden;
  /* Liquid glass base */
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:transform .12s cubic-bezier(.34,1.3,.64,1),box-shadow .12s,filter .08s;
}
/* Inner light refraction pseudo-element */
.ck::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,0) 100%);
  border-radius:50% 50% 0 0;
  pointer-events:none;
}
.ck:active{transform:scale(.88);filter:brightness(1.2);}
/* Forced press flash — triggered via JS, guaranteed visible even on fast taps
   or when the keypad DOM gets rebuilt right after (iOS :active is unreliable there) */
.ck-pressed{transform:scale(.86)!important;filter:brightness(1.45)!important;box-shadow:0 0 0 3px rgba(255,255,255,.35) inset,0 2px 10px rgba(0,0,0,.4)!important;transition:transform .06s,filter .06s,box-shadow .06s!important;}

/* Function buttons — frosted gray glass */
.ck-func{
  background:rgba(120,120,130,.38);
  box-shadow:0 2px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
}
/* Number buttons — dark glass */
.ck-num{
  background:rgba(50,50,60,.55);
  box-shadow:0 2px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.07);
  color:#fff;
}
/* Operator buttons — amber liquid glass */
.ck-op{
  background:linear-gradient(145deg,rgba(255,175,30,.85),rgba(230,140,0,.9));
  box-shadow:0 3px 16px rgba(255,160,0,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.2);
  border:1px solid rgba(255,200,80,.3);
  color:#fff;font-size:38px;font-weight:400;
}
.ck-op.op-lit{
  background:linear-gradient(145deg,rgba(255,175,30,.22),rgba(230,140,0,.18));
  box-shadow:0 2px 10px rgba(255,160,0,.15),inset 0 1px 0 rgba(255,200,80,.2);
  border:1px solid rgba(255,160,0,.4);
  color:#ff9f0a;
}

/* Small buttons (bottom row) */
.ck-sm{
  border:none;cursor:pointer;font-family:inherit;
  border-radius:50%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:500;
  width:100%;
  -webkit-user-select:none;user-select:none;
  position:relative;overflow:hidden;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .12s cubic-bezier(.34,1.3,.64,1),box-shadow .12s;
}
.ck-sm::before{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.15) 0%,transparent 100%);
  border-radius:50% 50% 0 0;pointer-events:none;
}
.ck-sm:active{transform:scale(.88);}
.ck-sm.ck-pressed{transform:scale(.86)!important;filter:brightness(1.45)!important;box-shadow:0 0 0 3px rgba(255,255,255,.35) inset,0 2px 10px rgba(0,0,0,.4)!important;transition:transform .06s,filter .06s,box-shadow .06s!important;}

.ck-dot{
  background:rgba(50,50,60,.55);
  box-shadow:0 2px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.07);
  color:#fff;font-size:38px;font-weight:600;
}
.ck-eq{
  background:linear-gradient(145deg,rgba(255,175,30,.85),rgba(230,140,0,.9));
  box-shadow:0 3px 16px rgba(255,160,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
  border:1px solid rgba(255,200,80,.3);
  color:#fff;font-size:38px;font-weight:400;
}
/* Done button — subtle white glass */
.ck-done{
  background:rgba(255,255,255,.15);
  box-shadow:0 2px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.15);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;font-size:12px;font-weight:800;letter-spacing:.3px;
  border-radius:50%;aspect-ratio:1;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  width:100%;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .12s cubic-bezier(.34,1.3,.64,1),box-shadow .12s;
  -webkit-user-select:none;user-select:none;
  position:relative;overflow:hidden;
}
.ck-done::before{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,transparent 100%);
  border-radius:50% 50% 0 0;pointer-events:none;
}
.ck-done:active{transform:scale(.88);}
.ck-done.ck-pressed{transform:scale(.86)!important;filter:brightness(1.3)!important;box-shadow:0 0 0 3px rgba(255,255,255,.3) inset!important;transition:transform .06s,filter .06s!important;}

/* Zero button — wide pill, glass */
.ck-zero{
  border:none;cursor:pointer;font-family:inherit;
  border-radius:100px;
  display:flex;align-items:center;padding-left:28px;
  font-size:32px;font-weight:500;
  color:#fff;
  background:rgba(50,50,60,.55);
  box-shadow:0 2px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.07);
  transition:transform .12s,box-shadow .12s;
  -webkit-user-select:none;user-select:none;
  height:100%;min-height:72px;
  position:relative;overflow:hidden;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
/* Pill top highlight */
.ck-zero::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,transparent 100%);
  border-radius:100px 100px 0 0;pointer-events:none;
}
.ck-zero:active{transform:scale(.97);filter:brightness(1.15);}
.ck-zero.ck-pressed{transform:scale(.96)!important;filter:brightness(1.4)!important;box-shadow:0 0 0 3px rgba(255,255,255,.3) inset!important;transition:transform .06s,filter .06s!important;}

/* DRUM PICKER */
.drum-wrap{position:relative;height:260px;overflow:hidden;cursor:grab;-webkit-user-select:none;user-select:none;touch-action:none;margin:0 0 4px}
.drum-wrap:active{cursor:grabbing}
.drum-track{position:absolute;left:0;right:0;display:flex;flex-direction:column;will-change:transform;padding:0 24px}
/* iOS-style item: perspective scaling */
.drum-item-el{height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:400;color:rgba(120,120,128,.5);flex-shrink:0;pointer-events:none;transition:none;letter-spacing:-.2px}
.drum-item-el.d1{font-size:20px;font-weight:500;color:rgba(120,120,128,.75)}
.drum-item-el.center{font-size:26px;font-weight:700;color:var(--t1)}
/* Selection indicator — iOS-style frosted lines */
.drum-sel-box{position:absolute;left:16px;right:16px;height:44px;top:108px;border-top:1px solid var(--sep);border-bottom:1px solid var(--sep);pointer-events:none;z-index:2;border-radius:4px}
/* Gradient fades */
.drum-fade-t{position:absolute;left:0;right:0;top:0;height:108px;background:linear-gradient(to bottom,var(--card) 0%,rgba(255,255,255,0) 100%);pointer-events:none;z-index:3}
.drum-fade-b{position:absolute;left:0;right:0;bottom:0;height:108px;background:linear-gradient(to top,var(--card) 0%,rgba(255,255,255,0) 100%);pointer-events:none;z-index:3}
@media(prefers-color-scheme:dark){
  .drum-fade-t{background:linear-gradient(to bottom,var(--card) 0%,transparent 100%)}
  .drum-fade-b{background:linear-gradient(to top,var(--card) 0%,transparent 100%)}
}
.drum-unit{text-align:center;font-size:13px;color:var(--t2);font-weight:600;padding:0 0 4px}
.drum-confirm-row{display:flex;gap:10px;padding:4px 14px 6px}
.drum-cancel{flex:1;padding:13px;border:none;border-radius:var(--r-lg);background:var(--bg2);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--t2)}
.drum-ok{flex:2;padding:13px;border:none;border-radius:var(--r-lg);background:var(--btn);color:var(--btn-fg);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:var(--btn-ring)}

/* SETTINGS */
.set-wrap{border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--sep);transition:background .15s}
.set-row:last-child{border-bottom:none}
.set-row:hover{background:var(--sep2)}
.set-l{display:flex;align-items:center;gap:9px}
.set-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.set-lbl{font-size:14px;font-weight:600}
.set-sub{font-size:11px;color:var(--t2);margin-top:1px}
.set-btn{font-size:12px;font-weight:700;border:none;border-radius:9px;padding:6px 13px;cursor:pointer;font-family:inherit;transition:all .15s}
.set-btn-blue{background:var(--bl);color:var(--blue)}
.set-btn-red{background:var(--rl);color:var(--red)}
.set-btn-green{background:var(--gl);color:var(--green)}

/* LOC SETTINGS - long-press drag */
.loc-set-item{display:flex;align-items:center;gap:7px;padding:10px 15px;background:var(--card);border-bottom:1px solid var(--sep);position:relative;transition:box-shadow .2s,transform .2s,opacity .2s;}
.loc-set-item:last-child{border-bottom:none}
.loc-set-item.is-dragging{opacity:.5;box-shadow:var(--sh-xl);transform:scale(1.02);z-index:10;border-radius:var(--r-md);}
.loc-set-item.drag-over-top{border-top:2.5px solid var(--blue);}
.loc-set-item.drag-over-bot{border-bottom:2.5px solid var(--blue);}
.loc-drag-handle{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:18px;flex-shrink:0;cursor:grab;-webkit-user-select:none;user-select:none;touch-action:none;}
.loc-drag-handle:active{cursor:grabbing;}
.loc-del-bg{position:absolute;right:0;top:0;bottom:0;width:80px;background:#ff3b30;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:opacity .2s;pointer-events:none;border-radius:0 0 0 0;}
.loc-set-item.swiped .loc-del-bg{opacity:1;pointer-events:all;}
.loc-set-item.swiped{transform:translateX(-80px);}
.loc-color-btn{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;flex-shrink:0;transition:transform .15s;box-shadow:var(--sh-s)}
.loc-color-btn:hover{transform:scale(1.15)}
.loc-emoji-input{width:34px;height:34px;border:1.5px solid var(--sep);border-radius:9px;background:var(--bg2);font-size:19px;text-align:center;padding:0;font-family:inherit;color:var(--t1);-webkit-text-fill-color:var(--t1);flex-shrink:0;outline:none;caret-color:transparent}
.loc-emoji-input:focus{border-color:var(--t2)}
.cp-custom{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--sep);font-size:13px;font-weight:700;color:var(--t2)}
.cp-wheel{position:relative;width:40px;height:40px;border-radius:50%;background:conic-gradient(#f43f5e,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#a855f7,#f43f5e);flex:none;display:block;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.cp-wheel i{position:absolute;inset:8px;border-radius:50%;background:var(--c,#2563eb);border:2px solid #fff;box-sizing:border-box}
.cp-wheel input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.cp-done{display:none;width:100%;margin-top:14px;padding:13px;border:none;border-radius:14px;background:var(--btn);color:var(--btn-fg);box-shadow:var(--btn-ring);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
.cp-done.show{display:block}
.loc-name-input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--t1);-webkit-text-fill-color:var(--t1)}
.loc-reform-toggle{font-size:9.5px;font-weight:800;border:none;border-radius:6px;padding:3px 7px;cursor:pointer;font-family:inherit;background:var(--bg2);color:var(--t2);flex-shrink:0}
.loc-reform-toggle.on{background:var(--pl);color:var(--purple)}
.loc-chev{border:none;background:none;color:var(--t3);font-size:20px;line-height:1;padding:4px 7px;cursor:pointer;flex:none;transition:transform .22s;font-family:inherit}
.loc-set-item.lo .loc-chev{transform:rotate(180deg)}
.loc-panel{display:none;border-top:1px solid var(--sep2)}
.loc-set-item.lo .loc-panel{display:block}
.loc-my{font-size:9px;font-weight:800;color:#fff;border-radius:6px;padding:2px 5px;flex:none}
.loc-pdel{display:block;width:100%;text-align:left;border:none;border-top:1px solid var(--sep2);background:none;color:var(--red);font-family:inherit;font-size:12.5px;font-weight:700;padding:11px 14px 12px 42px;cursor:pointer}
.set-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.set-h::after{content:'⌄';font-size:17px;font-weight:600;letter-spacing:0;transition:transform .22s;transform:translateY(-3px);padding:0 6px}
.set-h.closed::after{transform:rotate(-90deg) translateX(3px)}
.loc-del{border:none;background:none;color:var(--t3);font-size:15px;cursor:pointer;padding:3px 5px;border-radius:6px;transition:all .15s;line-height:1;flex-shrink:0}
.loc-del:hover{background:var(--rl);color:var(--red)}
.add-loc-btn{width:100%;padding:13px;border:none;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--sh-s);color:var(--blue);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;border:1.5px dashed rgba(37,99,235,.3);margin-top:8px;display:block}
.add-loc-btn:hover{background:var(--bl);border-color:var(--blue)}

/* COLOR PICKER */
.color-popup{position:fixed;z-index:9500;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh-xl);display:none;width:min(340px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;border:1px solid var(--sep);box-sizing:border-box}
.color-popup.open{display:block}
.color-popup-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 8px;padding:6px 4px 4px}
.cp-dot{width:100%;max-width:46px;aspect-ratio:1/1;justify-self:center;box-sizing:border-box;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s,box-shadow .12s;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.cp-dot:hover{transform:scale(1.15)}
.cp-dot.sel{border-color:white;transform:scale(1.1);box-shadow:0 3px 10px rgba(0,0,0,.3)}

/* iOS TOGGLE */
.ios-toggle{position:relative;width:46px;height:27px;flex-shrink:0}
.ios-toggle input{opacity:0;width:0;height:0;position:absolute}
.ios-slider{position:absolute;inset:0;border-radius:13px;background:var(--bg2);cursor:pointer;transition:background .25s cubic-bezier(.4,0,.2,1)}
.ios-slider::after{content:'';position:absolute;width:21px;height:21px;border-radius:50%;background:white;top:3px;left:3px;transition:transform .25s cubic-bezier(.34,1.4,.64,1);box-shadow:0 2px 6px rgba(0,0,0,.22)}
.ios-toggle input:checked+.ios-slider{background:var(--blue)}
.ios-toggle input:checked+.ios-slider::after{transform:translateX(19px)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(5px);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);width:100%;max-width:700px;max-height:88vh;background:var(--card);border-radius:26px 26px 0 0;padding:8px 17px 40px;z-index:201;overflow-y:auto;transition:transform .38s cubic-bezier(.32,.72,0,1)}
.modal-sheet.open{transform:translateX(-50%) translateY(0)}
.m-handle{width:36px;height:4px;border-radius:2px;background:var(--sep);margin:10px auto 16px;cursor:grab}
.m-close{position:absolute;top:17px;right:17px;width:27px;height:27px;border-radius:50%;background:var(--bg2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2)}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--sep)}
.mrow:last-child{border-bottom:none}
.mrow-l{font-size:13.5px;color:var(--t2)}
.mrow-v{font-size:13.5px;font-weight:800}
.m-act{display:flex;gap:8px;margin-top:15px}
.m-edit-btn{flex:1;padding:12px;border:none;border-radius:var(--r-lg);background:var(--btn);color:var(--btn-fg);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.m-del-btn{padding:12px 15px;border:none;border-radius:var(--r-lg);background:var(--rl);color:var(--red);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}

.copy-btn{width:100%;padding:14px;border:1.5px solid var(--sep);border-radius:var(--r-xl);background:var(--card);color:var(--t1);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;box-shadow:var(--sh-s);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:9px}
.copy-btn svg{color:var(--blue);flex:none}
.copy-btn:hover{transform:translateY(-1px)}

.empty{text-align:center;padding:48px 20px}
.empty-icon{font-size:40px;margin-bottom:10px;opacity:.5}
.empty-txt{font-size:14px;color:var(--t3);font-weight:600}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(24,24,27,.94);color:white;padding:10px 20px;border-radius:20px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.34,1.2,.64,1);backdrop-filter:blur(12px);white-space:nowrap;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.22)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .etbl-hdr,.erow{grid-template-columns:48px 1fr 68px 68px}
  .etbl-hdr span:last-child,.erow>*:last-child{display:none}
}

/* ══ CLIENTS ══ */
.cl-card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh);overflow:hidden;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.cl-card:active{transform:scale(.985)}
.cl-card-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.cl-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:white;flex-shrink:0;letter-spacing:-.5px}
.cl-name{font-size:16px;font-weight:700;letter-spacing:-.2px}
.cl-phone{font-size:13px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:4px}
.cl-tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 16px 12px}
.cl-tag{font-size:11px;font-weight:600;background:var(--bg2);color:var(--t2);border-radius:8px;padding:3px 9px}
.cl-tag.loc{color:white}
.cl-empty{text-align:center;padding:60px 20px;color:var(--t3)}
.cl-empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.cl-empty-txt{font-size:15px;font-weight:600;margin-bottom:6px}
.cl-empty-sub{font-size:13px;opacity:.7}

/* Client form sheet */
.cf-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.cf-lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);padding-left:2px}
.cf-input{border:none;outline:none;background:var(--bg2);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:15px;font-weight:500;color:var(--t1);-webkit-text-fill-color:var(--t1);width:100%;border:1.5px solid var(--sep)}
@media(prefers-color-scheme:dark){.cf-input{background:#2c2c2e;border-color:rgba(255,255,255,.12)}.cf-input::placeholder{color:#636366;-webkit-text-fill-color:#636366}}
.cf-input::placeholder{color:var(--t3);-webkit-text-fill-color:var(--t3)}
textarea.cf-input{resize:none;height:80px;line-height:1.5}
.cf-loc-grid{display:flex;flex-wrap:wrap;gap:6px}
.cf-loc-btn{flex:1;min-width:80px;padding:9px 8px;border:1.5px solid var(--sep);border-radius:12px;background:var(--card);font-family:inherit;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;text-align:center;transition:all .18s}
.cf-loc-btn.active{color:white;border-color:transparent}
.cf-actions{display:flex;gap:10px;margin-top:6px}
.cf-save{flex:2;padding:14px;border:none;border-radius:var(--r-lg);background:var(--btn);color:var(--btn-fg);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:var(--btn-ring)}
.cf-del{flex:1;padding:14px;border:none;border-radius:var(--r-lg);background:var(--rl);color:var(--red);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.cf-cancel{flex:1;padding:14px;border:none;border-radius:var(--r-lg);background:var(--bg2);color:var(--t2);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}

/* ══ BOTTOM TAB BAR — floating glass capsule (iOS 26) ══ */
.tab-bar{
  position:fixed;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:95;
  display:flex;align-items:stretch;gap:0;height:66px;padding:5px;
  border-radius:33px;
  background:rgba(246,246,250,.38);
  backdrop-filter:blur(26px) saturate(190%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 12px 32px rgba(20,20,40,.14),0 2px 6px rgba(20,20,40,.06),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.25);
}
@media(prefers-color-scheme:dark){
  .tab-bar{
    background:rgba(52,52,60,.42);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.04);
  }
}
.tab-btn{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border:none;background:none;cursor:pointer;
  padding:0 1px;min-width:0;border-radius:28px;
  -webkit-tap-highlight-color:transparent;
  transition:color .25s ease,transform .15s cubic-bezier(.34,1.3,.64,1);
  color:var(--t1);
  -webkit-user-select:none;user-select:none;
  position:relative;z-index:1;
}
.tab-btn:active{transform:scale(.9);}
.tab-icon-wrap{display:flex;align-items:center;justify-content:center;width:28px;height:26px;flex:none}
.tab-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:inherit}
.tab-icon svg{
  width:24px;height:24px;
  fill:currentColor;fill-opacity:.2;
  stroke:currentColor;stroke-width:1.8;
  transition:fill-opacity .25s ease;
}
.tab-btn::before{content:'';position:absolute;inset:0;border-radius:28px;background:rgba(120,120,128,.2);opacity:0;z-index:-1;transition:opacity .3s ease;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.tab-btn.active{color:var(--blue)}
.tab-btn.active::before{opacity:1}
.tab-btn.active .tab-icon svg{fill-opacity:.38}
@media(prefers-color-scheme:dark){
  .tab-btn{color:rgba(235,235,245,.85)}
  .tab-btn.active{color:var(--ac-l,#6ea8ff)}
  .tab-btn::before{background:rgba(255,255,255,.14)}
}
.tab-lbl-in{display:none;}
.tab-lbl-out{
  display:block;max-width:100%;font-size:10px;font-weight:600;letter-spacing:-.2px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.main{padding-bottom:calc(104px + env(safe-area-inset-bottom))!important}
.toast{bottom:calc(92px + env(safe-area-inset-bottom))!important}

/* Emoji picker */
.emoji-picker-ov{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.emoji-picker-ov.open{opacity:1;pointer-events:all}
.emoji-picker-box{background:var(--card);border-radius:26px 26px 0 0;width:100%;max-width:500px;padding:16px 16px calc(env(safe-area-inset-bottom)+16px);max-height:60vh;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:var(--sh-xl)}
.emoji-picker-ov.open .emoji-picker-box{transform:translateY(0)}
.emoji-picker-title{text-align:center;font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;overflow-y:auto;max-height:calc(60vh - 80px)}
.emoji-btn{border:none;background:none;font-size:24px;padding:6px;border-radius:10px;cursor:pointer;transition:background .12s,transform .12s cubic-bezier(.34,1.3,.64,1);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.emoji-btn:hover{background:var(--bg2)}
.emoji-btn:active{transform:scale(.85);background:var(--bl)}
.emoji-btn.selected{background:var(--bl);outline:2px solid var(--blue)}

/* Pct slider sheet */
.pct-display{text-align:center;padding:20px 20px 10px;background:var(--s1)}
.pct-big{font-size:72px;font-weight:200;letter-spacing:-4px;color:var(--t1);line-height:1}
.pct-unit{font-size:24px;font-weight:300;color:#8e8e93}
.pct-slider-wrap{padding:0 24px 8px;background:var(--s1)}
input.pct-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,#ff9f0a 0%,#ff9f0a var(--pct-fill,45%),var(--k2) var(--pct-fill,45%),var(--k2) 100%)}
input.pct-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
input.pct-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pct-presets{display:flex;gap:8px;padding:0 20px 12px;background:var(--s1);justify-content:center}
.pct-preset{padding:8px 16px;border:none;border-radius:20px;background:var(--k1);box-shadow:var(--k-sh);color:#8e8e93;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.pct-preset.on{background:#ff9f0a;color:#000}

/* ── CARD ANIMATION ── */
@keyframes cardIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.sc.anim{animation:cardIn .38s cubic-bezier(.34,1.2,.64,1) both}
.anim-d1{animation-delay:.04s}.anim-d2{animation-delay:.08s}
.anim-d3{animation-delay:.12s}.anim-d4{animation-delay:.16s}
.anim-d5{animation-delay:.20s}.anim-d6{animation-delay:.24s}
.anim-d7{animation-delay:.28s}.anim-d8{animation-delay:.32s}

/* ── ODOMETER ── */
.odo-wrap{display:inline-block;overflow:hidden;height:1.1em;vertical-align:bottom}
.odo-inner{display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.4,0,.2,1)}

/* ── PULL TO REFRESH ── */
.ptr-indicator{
  position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-60px);
  background:var(--card);border-radius:20px;padding:8px 16px;
  box-shadow:var(--sh);font-size:13px;font-weight:700;color:var(--blue);
  display:flex;align-items:center;gap:6px;z-index:89;
  transition:transform .3s cubic-bezier(.34,1.2,.64,1),opacity .3s;
  opacity:0;pointer-events:none;
}
.ptr-indicator.visible{transform:translateX(-50%) translateY(0);opacity:1}
.ptr-spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── DAY CHART ── */
.day-chart{padding:14px 16px 10px;overflow-x:auto;scrollbar-width:none}
.day-chart::-webkit-scrollbar{display:none}
.chart-scroll::-webkit-scrollbar{display:none}
#bk-pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -14px;padding:2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#bk-pager::-webkit-scrollbar{display:none}
.bk-card{flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;padding:16px 16px 14px}
.bk-dot{width:7px;height:7px;border-radius:50%;background:var(--t3);opacity:.3;transition:opacity .2s,width .2s,background .2s}
.bk-dot.on{opacity:1;width:20px;border-radius:4px;background:var(--blue)}
#bk-dots{display:flex;justify-content:center;align-items:center;gap:6px;margin:11px 0 2px}
.day-chart-inner{display:flex;align-items:flex-end;gap:4px;min-width:max-content;height:96px}
.day-bar{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.day-bar-fill{width:18px;border-radius:5px 5px 0 0;min-height:3px;transition:opacity .15s}
.day-bar:hover .day-bar-fill{opacity:.75}
.day-bar-lbl{font-size:8.5px;font-weight:600;color:var(--t3);white-space:nowrap}
.day-bar-off{width:18px;border-radius:5px;background:var(--bg2);height:18px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--t3)}

/* ── PARALLAX CARDS ── */
.sg.parallax-group .sc{will-change:transform;transition:transform .1s linear,box-shadow .2s}

/* ── DAY OFF ── */
.dayoff-btn{
  width:100%;padding:13px;border:1.5px dashed rgba(120,120,140,.3);
  border-radius:var(--r-xl);background:none;font-family:inherit;
  font-size:14px;font-weight:600;color:var(--t3);cursor:pointer;
  transition:all .2s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px
}
.dayoff-btn:hover,.dayoff-btn:active{background:var(--bg2);border-color:var(--t3)}
.dayoff-btn.on{background:var(--rl);border-color:var(--red);color:var(--red)}
@media(prefers-color-scheme:dark){
}
/* Hide FAB when a sheet/modal is open so it never blocks the form */
/* Client search row — clean, no sticky patch */
.cl-search-wrap{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;
}
.cl-search-box{
  flex:1;
  background:var(--card);
  border-radius:14px;
  display:flex;align-items:center;gap:9px;
  padding:12px 15px;
  min-width:0;
  box-shadow:var(--sh-s);
}
.cl-search-box input{
  flex:1;border:none;outline:none;background:none;
  font-family:inherit;font-size:15px;font-weight:500;
  color:var(--t1);-webkit-text-fill-color:var(--t1);
  min-width:0;
}
.cl-search-box input::placeholder{color:var(--t3);-webkit-text-fill-color:var(--t3)}
.cl-search-box input::-webkit-search-cancel-button{-webkit-appearance:none}
.cl-add-btn{
  flex-shrink:0;
  width:46px;height:46px;border-radius:14px;
  border:none;cursor:pointer;
  background:var(--btn);color:var(--btn-fg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--btn-ring);
  transition:transform .15s cubic-bezier(.34,1.3,.64,1);
}
.cl-add-btn:active{transform:scale(.9)}
@media(prefers-color-scheme:dark){
  .cl-search-box{background:var(--card)}
}

/* ═══════════════════════════════════════════════════════
   LIQUID GLASS — слой нового дизайна (только визуал)
   ═══════════════════════════════════════════════════════ */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(640px 430px at 85% -8%,rgba(37,99,235,.16),transparent 62%),
   radial-gradient(520px 380px at -12% 28%,rgba(124,58,237,.13),transparent 62%),
   radial-gradient(640px 420px at 55% 112%,rgba(22,163,74,.11),transparent 62%);
}
:root{
  --glass:rgba(255,255,255,.6);
  --glass-bd:rgba(255,255,255,.55);
  --glass-hi:rgba(255,255,255,.75);
}
@media(prefers-color-scheme:dark){
  :root{
    --glass:rgba(30,30,40,.5);
    --glass-bd:rgba(255,255,255,.08);
    --glass-hi:rgba(255,255,255,.08);
  }
  body::before{
    background:
     radial-gradient(640px 430px at 85% -8%,rgba(59,130,246,.13),transparent 62%),
     radial-gradient(520px 380px at -12% 28%,rgba(139,92,246,.11),transparent 62%),
     radial-gradient(640px 420px at 55% 112%,rgba(34,197,94,.08),transparent 62%);
  }
}
/* стеклянные поверхности */
.card,
.sc:not(.hero):not(.hero-p),
.prev-strip,
.dsum,
.form-group,
.set-wrap,
.cl-card,
.cl-search-box,
.ptabs,
.loc-pill,
.dayoff-btn,
.add-loc-btn{
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--glass-bd);
  box-shadow:0 8px 28px rgba(0,0,0,.07),inset 0 1px 0 var(--glass-hi);
}
.dayoff-btn{border-style:dashed}
/* внутренние ряды — прозрачные, чтобы стекло карточки просвечивало */
.frow,.set-row,.loc-set-item,.loc-row,.erow{background:transparent}
/* шторки и попапы — более плотное стекло */
.modal-sheet,.picker-box,.emoji-picker-box,.color-popup{
  background:var(--glass);
  backdrop-filter:blur(36px) saturate(185%);
  -webkit-backdrop-filter:blur(36px) saturate(185%);
  border:1px solid var(--glass-bd);
}
/* анимация переключения вкладок */
@keyframes tabIn{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:none}}
.tab-anim{animation:tabIn .34s cubic-bezier(.34,1.25,.64,1)}
/* приятные нажатия */
.set-btn:active,.cl-add-btn:active,.mnav-btn:active,.cal-nav:active{transform:scale(.9)}
.frow:active,.cl-card:active,.set-row:active{background:rgba(120,120,140,.08)}
.save-btn:active,.copy-btn:active,.cf-save:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){.tab-anim{animation:none}}


/* ══ Modern form kit (services + appointment sheet) ══ */
.mf-wrap{padding:2px 18px 6px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mf-field{margin-bottom:16px}

.mf-input{width:100%;border:none;outline:none;background:var(--bg2);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600;font-family:inherit;color:var(--t1);-webkit-text-fill-color:var(--t1);box-sizing:border-box;-webkit-appearance:none;appearance:none;transition:box-shadow .15s}
.mf-input:focus{box-shadow:inset 0 0 0 2px var(--blue)}

.mf-chip.on{background:var(--btn);color:var(--btn-fg);box-shadow:var(--btn-ring)}

.mf-stepper{display:flex;align-items:center;background:var(--bg2);border-radius:14px;overflow:hidden}
.mf-stepper button{width:42px;flex:none;height:48px;border:none;background:none;font-size:22px;font-weight:500;color:var(--blue);cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.mf-stepper button:active{background:var(--sep)}
.mf-stepper div{flex:1;text-align:center;font-size:17px;font-weight:700}

.mf-btn{flex:1;padding:15px;border:none;border-radius:16px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.mf-btn:active{transform:scale(.97)}
.mf-btn.sec{background:var(--bg2);color:var(--t2);flex:none;padding:15px 20px}

}

/* ══════════════════════════════════════════
   HAPTIC FEEDBACK
   iOS Safari: no Vibration API → use AudioContext click (silent but triggers Taptic)
   Android/others: use navigator.vibrate
══════════════════════════════════════════ */
let _ac=null;
function hap(type){
  // Try native vibration (Android, some browsers)
  if(navigator.vibrate){
    if(type==='light')navigator.vibrate(6);
    else if(type==='medium')navigator.vibrate(15);
    else if(type==='heavy')navigator.vibrate([12,6,12]);
    else if(type==='selection')navigator.vibrate(4);
    else if(type==='error')navigator.vibrate([20,10,20]);
    return;
  }
  // iOS Safari fallback: AudioContext tiny click (won't vibrate but won't error)
  try{
    if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended')_ac.resume();
    const o=_ac.createOscillator(),g=_ac.createGain();
    o.connect(g);g.connect(_ac.destination);
    const dur=type==='heavy'?0.04:type==='medium'?0.025:0.012;
    g.gain.setValueAtTime(0.0001,_ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.00001,_ac.currentTime+dur);
    o.start(_ac.currentTime);o.stop(_ac.currentTime+dur);
  }catch(e){}
}
// Add haptic to all interactive elements
document.addEventListener('touchstart',e=>{
  const t=e.target.closest('button,.loc-pill,.frow,.cd,.pm,.mnav-btn,.cal-nav,.tab-btn,.ck,.ck-zero,.ck-sm,.ck-done,.drum-ok,.drum-cancel,.copy-btn,.save-btn,.m-edit-btn,.m-del-btn');
  if(t)hap('light');
},{passive:true});

// Calculator keys: guaranteed visible press-flash. CSS :active alone is unreliable on
// iOS Safari, especially when the whole keypad re-renders right after a tap (AC, operators).
// Flash the key the instant the finger touches it, and keep it visible for a minimum
// time even if that key's DOM node gets replaced immediately after by the click handler.
let _ckFlashTimer=null;
document.addEventListener('touchstart',e=>{
  const key=e.target.closest('.ck,.ck-sm,.ck-zero,.ck-done');
  if(!key)return;
  key.classList.add('ck-pressed');
  clearTimeout(_ckFlashTimer);
  _ckFlashTimer=setTimeout(()=>{
    document.querySelectorAll('.ck-pressed').forEach(el=>el.classList.remove('ck-pressed'));
  },110);
},{passive:true});

/* ══ CALCULATOR ══ */
let cKey='';
// Expression as token array: [num, op, num, op, ...] e.g. [2,'+',3,'*',5]
let cTokens=[],cCur='0',cNewNum=true,cLastOp=null,cJustEvaled=false;

let cSavedExpr='';
function openCalc(k){
  cKey=k;
  cTokens=[];cCur=fVals[k]?String(fVals[k]):'0';
  cNewNum=true;cLastOp=null;cJustEvaled=false;
  // Load saved expression for this field (persists across sessions via entry.exprs)
  cSavedExpr=(window._fvalExpr&&window._fvalExpr[k])||'';
  document.getElementById('sheet-title').textContent=T.calcTitle;
  renderCalcBody();
  openSheet();
}

function buildExprStr(){
  const SYM={'+':'+','-':'−','*':'×','/':'÷'};
  let s='';
  for(let i=0;i<cTokens.length;i++){
    if(typeof cTokens[i]==='number') s+=fmtDisp(String(cTokens[i]));
    else s+=' '+SYM[cTokens[i]]+' ';
  }
  return s.trim();
}
// Full expression including the current number being typed
function buildFullExpr(){
  const SYM={'+':'+','-':'−','*':'×','/':'÷'};
  let s='';
  const toks=[...cTokens];
  // Add current number if user is mid-typing
  if(!cNewNum)toks.push(parseFloat(cCur));
  for(let i=0;i<toks.length;i++){
    if(typeof toks[i]==='number')s+=fmtDisp(String(toks[i]));
    else s+=' '+SYM[toks[i]]+' ';
  }
  return s.trim();
}

function renderCalcBody(){
  const expr=buildExprStr();
  // Show: live expression if typing, else saved previous calc as hint
  // NOTE: cSavedExpr already contains "= result" (set by cEquals/cDone) — never append another "="
  let histText=expr;
  if(!expr&&cSavedExpr){histText=cSavedExpr;}
  const sb=document.getElementById('sheet-body');
  if(!sb)return;
  sb.innerHTML=`<div class="calc-wrap">
    <div class="calc-display">
      <div id="c-hist" style="min-height:22px;font-size:16px;font-weight:500;color:#8e8e93;text-align:right;padding:0 4px 2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none">${histText||'&nbsp;'}</div>
      <div class="calc-main-num" id="c-num">${fmtDisp(cCur)}</div>
    </div>
    <div class="calc-pad">
      <button class="ck ck-func" style="font-size:26px" onclick="cDel()">⌫</button>
      <button class="ck ck-func" style="font-weight:600" onclick="cAC()">AC</button>
      <button class="ck ck-func" style="font-weight:600" onclick="cPct()">%</button>
      <button class="ck ck-op${cLastOp==='/'?' op-lit':''}" onclick="cSetOp('/')">÷</button>
      <button class="ck ck-num" onclick="cDig('7')">7</button>
      <button class="ck ck-num" onclick="cDig('8')">8</button>
      <button class="ck ck-num" onclick="cDig('9')">9</button>
      <button class="ck ck-op${cLastOp==='*'?' op-lit':''}" onclick="cSetOp('*')">×</button>
      <button class="ck ck-num" onclick="cDig('4')">4</button>
      <button class="ck ck-num" onclick="cDig('5')">5</button>
      <button class="ck ck-num" onclick="cDig('6')">6</button>
      <button class="ck ck-op${cLastOp==='-'?' op-lit':''}" onclick="cSetOp('-')">−</button>
      <button class="ck ck-num" onclick="cDig('1')">1</button>
      <button class="ck ck-num" onclick="cDig('2')">2</button>
      <button class="ck ck-num" onclick="cDig('3')">3</button>
      <button class="ck ck-op${cLastOp==='+'?' op-lit':''}" onclick="cSetOp('+')">+</button>
    </div>
    <div class="calc-pad-bottom">
      <button class="ck-zero" onclick="cDig('0')">0</button>
      <button class="ck-sm ck-dot" onclick="cDot()">,</button>
      <button class="ck-sm ck-eq" onclick="cEquals()">=</button>
      <button class="ck-done" onclick="cDone()">✓ ${T.done}</button>
    </div>
  </div>`;
}

function fmtDisp(v){
  const s=String(v);const n=parseFloat(s);if(isNaN(n))return'0';
  if(s.endsWith('.'))return n.toLocaleString('pl-PL')+',';
  if(s.includes('.')){const pts=s.split('.');return pts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+pts[1]}
  return n.toLocaleString('pl-PL');
}

function updDispOnly(){
  const en=document.getElementById('c-num');
  const eh=document.getElementById('c-hist');
  if(en)en.textContent=fmtDisp(cCur);
  if(eh){
    const s=buildExprStr();
    let txt=s;
    // cSavedExpr already contains "= result" — do not append another "="
    if(!s&&cSavedExpr)txt=cSavedExpr;
    eh.textContent=txt||'\u00a0';eh.scrollLeft=eh.scrollWidth;
  }
}

function cDig(d){
  if(cJustEvaled){cTokens=[];cJustEvaled=false;}
  // Starting a brand new number clears the old saved-expression hint
  if(cNewNum&&cTokens.length===0)cSavedExpr='';
  if(cNewNum){cCur=d;cNewNum=false;}
  else cCur=(cCur==='0')?d:(cCur.length<14?cCur+d:cCur);
  updDispOnly();
}
function cDot(){
  if(cJustEvaled){cTokens=[];cJustEvaled=false;}
  if(cNewNum){cCur='0.';cNewNum=false;}
  else if(!cCur.includes('.'))cCur+='.';
  updDispOnly();
}
function cDel(){
  if(cNewNum){
    if(cTokens.length>=2){cTokens.pop();const prev=cTokens.pop();cCur=String(prev);cLastOp=cTokens.length?cTokens[cTokens.length-1]:null;}
    else{cCur='0';cTokens=[];cLastOp=null;}
    cNewNum=false;cJustEvaled=false;
  } else {
    cCur=cCur.length>1?cCur.slice(0,-1):'0';
    if(cCur==='0')cNewNum=true;
  }
  renderCalcBody();
}
function cAC(){cTokens=[];cCur='0';cNewNum=true;cLastOp=null;cJustEvaled=false;cSavedExpr='';renderCalcBody();}
function cPct(){cCur=String(Math.round(parseFloat(cCur)/100*1e10)/1e10);updDispOnly();}

function cSetOp(op){
  cJustEvaled=false;
  const n=parseFloat(cCur);
  if(!cNewNum){
    cTokens.push(n);
    cTokens.push(op);
    cNewNum=true;
  } else {
    // Replace last op if no new number typed
    if(cTokens.length&&typeof cTokens[cTokens.length-1]==='string'){
      cTokens[cTokens.length-1]=op;
    } else {
      cTokens.push(n);
      cTokens.push(op);
      cNewNum=true;
    }
  }
  cLastOp=op;
  renderCalcBody();
}

/* Evaluate with correct operator precedence: * / before + - */
function evalTokens(toks){
  if(!toks.length)return 0;
  let arr=[...toks];
  // Pass 1: * and /
  let i=1;
  while(i<arr.length){
    if(arr[i]==='*'||arr[i]==='/'){
      const res=arr[i]==='*'?arr[i-1]*arr[i+1]:(arr[i+1]!==0?arr[i-1]/arr[i+1]:0);
      arr.splice(i-1,3,Math.round(res*1e8)/1e8);
    } else i+=2;
  }
  // Pass 2: + and -
  let result=arr[0];
  for(let j=1;j<arr.length;j+=2){
    if(arr[j]==='+')result+=arr[j+1];
    else if(arr[j]==='-')result-=arr[j+1];
  }
  return Math.round(result*1e8)/1e8;
}

function cEquals(){
  if(!cTokens.length)return;
  let toks=[...cTokens];
  if(!cNewNum){
    // There's a pending number — append it (trailing op stays as connector)
    toks.push(parseFloat(cCur));
  } else {
    // No pending number — drop trailing operator(s)
    while(toks.length&&typeof toks[toks.length-1]==='string')toks.pop();
  }
  if(toks.length<2){return}// nothing to compute
  // Build clean expression string from the cleaned tokens
  const SYM={'+':'+','-':'−','*':'×','/':'÷'};
  let exprFull='';
  for(let i=0;i<toks.length;i++){
    if(typeof toks[i]==='number')exprFull+=fmtDisp(String(toks[i]));
    else exprFull+=' '+SYM[toks[i]]+' ';
  }
  const result=evalTokens(toks);
  const r=Math.round(result*100)/100;
  // Store the full expression with result as the saved history (contains "=" exactly once)
  cSavedExpr=exprFull.trim()+' = '+fmtDisp(String(r));
  cCur=String(r);cTokens=[];cNewNum=true;cLastOp=null;cJustEvaled=true;
  renderCalcBody();
}

function cDone(){
  let toks=[...cTokens];
  if(!cNewNum){
    toks.push(parseFloat(cCur));
  } else {
    while(toks.length&&typeof toks[toks.length-1]==='string')toks.pop();
  }
  let v=toks.length?evalTokens(toks):parseFloat(cCur)||0;
  v=Math.round(v*100)/100;
  if(isNaN(v)||!isFinite(v))v=0;

  if(!window._fvalExpr)window._fvalExpr={};
  if(toks.length>=2){
    // Multi-step calc — build clean expression with result (single "=")
    const SYM={'+':'+','-':'−','*':'×','/':'÷'};
    let expr='';
    for(let i=0;i<toks.length;i++){
      if(typeof toks[i]==='number')expr+=fmtDisp(String(toks[i]));
      else expr+=' '+SYM[toks[i]]+' ';
    }
    window._fvalExpr[cKey]=expr.trim()+' = '+fmtDisp(String(v));
  } else if(cJustEvaled&&cSavedExpr){
    // Just pressed = then OK — keep the equals expression as-is (already has one "=")
    window._fvalExpr[cKey]=cSavedExpr;
  } else {
    // Plain single number — no history
    window._fvalExpr[cKey]='';
  }
  setFval(cKey,v);closeSheet();
}
