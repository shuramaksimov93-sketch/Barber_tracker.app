let ptrStartY=0,ptrActive=false,ptrTriggered=false;
function setupPullToRefresh(){
  const statsTab=document.getElementById('tab-stats');
  const indicator=document.getElementById('ptr-indicator');
  const icon=document.getElementById('ptr-icon');
  const lbl=document.getElementById('ptr-lbl');

  document.addEventListener('touchstart',e=>{
    if(document.getElementById('tab-stats').style.display==='none')return;
    if(window.scrollY>0)return;
    ptrStartY=e.touches[0].clientY;ptrActive=true;ptrTriggered=false;
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!ptrActive)return;
    const dy=e.touches[0].clientY-ptrStartY;
    if(dy>60&&!ptrTriggered){
      indicator.classList.add('visible');
      icon.classList.add('ptr-spin');
      lbl.textContent=lang==='ru'?'Обновление…':lang==='pl'?'Odświeżanie…':'Refreshing…';
    }
    if(dy>60)ptrTriggered=true;
  },{passive:true});

  document.addEventListener('touchend',()=>{
    if(!ptrActive)return;ptrActive=false;
    if(ptrTriggered){
      setTimeout(()=>{
        renderStats();
        indicator.classList.remove('visible');
        icon.classList.remove('ptr-spin');
        ptrTriggered=false;
        showToast(lang==='ru'?'✓ Обновлено':lang==='pl'?'✓ Odświeżono':'✓ Refreshed');
      },600);
    } else {
      indicator.classList.remove('visible');
    }
  },{passive:true});
}

/* ══════════════════════════════════════
   DAY CHART (income by day in month)
══════════════════════════════════════ */
function renderDayChart(allE,dayOffArr){
  const card=document.getElementById('day-chart-card');
  const canvas=document.getElementById('day-canvas');
  const yCanvas=document.getElementById('day-y-canvas');
  const scroll=document.getElementById('day-chart-scroll');
  const lblEl=document.getElementById('sl-daychart');
  if(!canvas||!card||!scroll||!yCanvas)return;
  if(lblEl)lblEl.textContent=lang==='ru'?'Доход по дням':lang==='pl'?'Dochód dzienny':'Daily income';

  const dim=new Date(stM.y,stM.m+1,0).getDate();
  const now=new Date();
  const isCurrentMonth=stM.m===now.getMonth()&&stM.y===now.getFullYear();
  const todayDay=isCurrentMonth?now.getDate():dim;

  const byDay={};
  allE.forEach(e=>{
    const d=parseInt(e.date.split('-')[2]);
    if(!byDay[d])byDay[d]={total:0,byLoc:{}};
    byDay[d].total+=e.total;
    byDay[d].byLoc[e.locId]=(byDay[d].byLoc[e.locId]||0)+e.total;
  });

  const activeLocs=locs.filter(l=>Object.values(byDay).some(d=>d.byLoc[l.id]));
  const workedList=Object.keys(byDay).filter(d=>parseInt(d)<=todayDay&&byDay[d].total>0).map(Number);
  const totalSoFar=workedList.reduce((s,d)=>s+byDay[d].total,0);
  const avgDay=workedList.length>0?totalSoFar/workedList.length:0;

  // Smart forecast by weekday pattern
  let forecastEnd=0;
  if(isCurrentMonth&&avgDay>0&&workedList.length>2){
    const wdCount={},wdTotal={};
    workedList.forEach(d=>{
      const wd=new Date(stM.y,stM.m,d).getDay();
      wdCount[wd]=(wdCount[wd]||0)+1;wdTotal[wd]=(wdTotal[wd]||0)+byDay[d].total;
    });
    const wdAvg={};Object.keys(wdCount).forEach(wd=>wdAvg[wd]=wdTotal[wd]/wdCount[wd]);
    let proj=totalSoFar;
    for(let d=todayDay+1;d<=dim;d++){
      if(isDayOff(`${stM.y}-${p2(stM.m+1)}-${p2(d)}`))continue;
      const wd=new Date(stM.y,stM.m,d).getDay();
      if(wdAvg[wd])proj+=wdAvg[wd];
    }
    forecastEnd=Math.round(proj);
  }

  // Legend — no forecast dot
  const legend=document.getElementById('day-legend');
  if(legend){
    legend.innerHTML=activeLocs.map(l=>
      `<div style="display:flex;align-items:center;gap:5px">
        <div style="width:12px;height:12px;border-radius:3px;background:${l.color}"></div>
        <span style="font-size:11px;font-weight:600;color:var(--t2)">${l.icon} ${l.name.split(' ')[0]}</span>
      </div>`).join('');
  }

  const dpr=window.devicePixelRatio||1;
  const DAY_W=40,BAR_W=26;
  const Y_W=42;
  const PAD={L:6,R:10,T:18,B:32};
  const H=215;

  // ── Y AXIS (sticky canvas) ──
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const tClr=dark?'rgba(255,255,255,.38)':'rgba(0,0,0,.4)';
  const gClr=dark?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)';

  const rawMax=Math.max(...Object.values(byDay).map(d=>d.total),1)*1.15;
  const mag=Math.pow(10,Math.floor(Math.log10(rawMax)));
  const step=mag*(rawMax/mag<=2?.5:rawMax/mag<=5?1:2);
  const maxVal=Math.ceil(rawMax/step)*step;
  const cH=H-PAD.T-PAD.B;
  const yOf=v=>PAD.T+cH*(1-Math.min(v/maxVal,1));

  yCanvas.width=Y_W*dpr; yCanvas.height=H*dpr;
  yCanvas.style.width=Y_W+'px'; yCanvas.style.height=H+'px';
  const yCtx=yCanvas.getContext('2d');
  yCtx.scale(dpr,dpr);
  // Y axis background
  yCtx.fillStyle=dark?'#1c1c1e':'#ffffff';
  yCtx.fillRect(0,0,Y_W,H);
  // Grid value labels
  for(let i=1;i<=4;i++){
    const v=maxVal/4*i,y=yOf(v);
    yCtx.fillStyle=tClr;
    yCtx.font='600 9px -apple-system,sans-serif';yCtx.textAlign='right';
    yCtx.fillText(fmtShort(v),Y_W-5,y+3.5);
    // Grid line hint
    yCtx.strokeStyle=gClr;yCtx.lineWidth=1;
    yCtx.beginPath();yCtx.moveTo(Y_W-3,y);yCtx.lineTo(Y_W,y);yCtx.stroke();
  }
  if(avgDay>0){
    const ay=yOf(avgDay);
    yCtx.fillStyle=dark?'rgba(255,255,255,.28)':'rgba(0,0,0,.28)';
    yCtx.font='600 8px -apple-system,sans-serif';yCtx.textAlign='right';
    yCtx.fillText('ø',Y_W-5,ay-3);
  }
  // Right border
  yCtx.strokeStyle=gClr;yCtx.lineWidth=1;
  yCtx.beginPath();yCtx.moveTo(Y_W-0.5,PAD.T);yCtx.lineTo(Y_W-0.5,H-PAD.B);yCtx.stroke();

  // ── BARS CANVAS ──
  const W=PAD.L+dim*DAY_W+PAD.R;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.imageSmoothingEnabled=false;
  ctx.textRendering='geometricPrecision';
  const xOf=d=>PAD.L+(d-0.5)*DAY_W;

  // Grid lines on bars canvas
  for(let i=1;i<=4;i++){
    const y=yOf(maxVal/4*i);
    ctx.strokeStyle=gClr;ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  // Avg line
  if(avgDay>0){
    const ay=yOf(avgDay);
    ctx.strokeStyle=dark?'rgba(255,255,255,.15)':'rgba(0,0,0,.12)';
    ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(0,ay);ctx.lineTo(W,ay);ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw bars
  for(let d=1;d<=dim;d++){
    const cx=xOf(d);
    const ds=`${stM.y}-${p2(stM.m+1)}-${p2(d)}`;
    const isOff=dayOffArr.includes(ds);
    const isToday=d===todayDay&&isCurrentMonth;

    // Day label
    ctx.fillStyle=isToday?'rgba(255,159,10,.95)':tClr;
    ctx.font=isToday?'800 9.5px -apple-system,sans-serif':'500 9px -apple-system,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(isToday?(lang==='pl'?'dziś':lang==='ru'?'сег':'now'):String(d),cx,H-PAD.B+13);

    if(isOff){
      ctx.fillStyle=dark?'rgba(255,80,70,.45)':'rgba(200,50,40,.38)';
      ctx.font='700 13px -apple-system,sans-serif';ctx.textAlign='center';
      ctx.fillText('×',cx,PAD.T+cH-6);continue;
    }
    const data=byDay[d];
    if(!data){
      ctx.fillStyle=dark?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)';
      ctx.beginPath();ctx.arc(cx,PAD.T+cH-3,2,0,Math.PI*2);ctx.fill();continue;
    }

    const totalH=Math.round(Math.max(Math.round(data.total/maxVal*cH),18));
    const segs=activeLocs.filter(l=>data.byLoc[l.id]).map(l=>({c:l.color,v:data.byLoc[l.id]}));
    let sy=Math.round(PAD.T+cH);
    segs.forEach((seg,i)=>{
      const isLast=i===segs.length-1,isFirst=i===0;
      const segH=Math.round(isLast?(sy-(PAD.T+cH-totalH)):Math.max(Math.round(seg.v/data.total*totalH),3));
      sy=Math.round(sy-segH);
      ctx.fillStyle=seg.c;ctx.beginPath();
      const r=5;
      if(segs.length===1){roundRect(ctx,cx-BAR_W/2,sy,BAR_W,segH,r);}
      else if(isLast){
        ctx.moveTo(cx-BAR_W/2+r,sy);ctx.lineTo(cx+BAR_W/2-r,sy);
        ctx.arcTo(cx+BAR_W/2,sy,cx+BAR_W/2,sy+r,r);ctx.lineTo(cx+BAR_W/2,sy+segH);
        ctx.lineTo(cx-BAR_W/2,sy+segH);ctx.lineTo(cx-BAR_W/2,sy+r);
        ctx.arcTo(cx-BAR_W/2,sy,cx-BAR_W/2+r,sy,r);ctx.closePath();
      } else if(isFirst){
        ctx.moveTo(cx-BAR_W/2,sy);ctx.lineTo(cx+BAR_W/2,sy);
        ctx.lineTo(cx+BAR_W/2,sy+segH-r);ctx.arcTo(cx+BAR_W/2,sy+segH,cx+BAR_W/2-r,sy+segH,r);
        ctx.lineTo(cx-BAR_W/2+r,sy+segH);ctx.arcTo(cx-BAR_W/2,sy+segH,cx-BAR_W/2,sy+segH-r,r);
        ctx.lineTo(cx-BAR_W/2,sy);ctx.closePath();
      } else {ctx.rect(cx-BAR_W/2,sy,BAR_W,segH);}
      ctx.fill();
      if(segH>=14){
        ctx.fillStyle='rgba(255,255,255,.97)';
        ctx.font='700 9px -apple-system,sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='alphabetic';
        ctx.fillText(fmtShort(seg.v),Math.round(cx),Math.round(sy+segH-5));
      }
    });
    if(isToday){
      ctx.shadowColor='rgba(255,159,10,.35)';ctx.shadowBlur=12;
      ctx.strokeStyle='rgba(255,159,10,.8)';ctx.lineWidth=1.5;ctx.setLineDash([]);
      ctx.beginPath();roundRect(ctx,cx-BAR_W/2-2,PAD.T+cH-totalH-2,BAR_W+4,totalH+4,7);ctx.stroke();
      ctx.shadowBlur=0;
    }
    if(totalH>=20&&segs.length===1){
      ctx.fillStyle='rgba(255,255,255,.97)';
      ctx.font='700 9px -apple-system,sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='alphabetic';
      ctx.fillText(fmtShort(data.total),Math.round(cx),Math.round(PAD.T+cH-6));
    }
  }

  card.style.display='';
  if(isCurrentMonth)requestAnimationFrame(()=>{scroll.scrollLeft=Math.max(0,xOf(todayDay)-scroll.clientWidth*0.65);});

  canvas._data={byDay,dim,xOf,DAY_W,BAR_W,activeLocs,dark,PAD,H,W,cH,maxVal,yOf,dayOffArr,todayDay};

  // Forecast footer
  const fc=document.getElementById('day-forecast');
  if(fc){
    if(isCurrentMonth&&forecastEnd>0&&workedList.length>2){
      document.getElementById('fc-label').textContent=
        lang==='ru'?'Прогноз к концу месяца':lang==='pl'?'Prognoza na koniec miesiąca':'Month forecast';
      document.getElementById('fc-avg').textContent=
        lang==='ru'?'На основе паттерна рабочих дней':
        lang==='pl'?'Na podstawie wzorca dni roboczych':'Based on working day pattern';
      document.getElementById('fc-val').textContent=fmt(forecastEnd)+' zł';
      fc.style.display='';
    } else fc.style.display='none';
  }
}


/* ══ PARALLAX ══ */
function setupStatsSwipe(){
  const sv=document.getElementById('sv-month');
  if(!sv)return;
  let startX=0,startY=0,tracking=false;

  sv.addEventListener('touchstart',e=>{
    // Don't interfere with chart scroll
    if(e.target.closest('#day-chart-scroll'))return;
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;tracking=true;
  },{passive:true});

  sv.addEventListener('touchend',e=>{
    if(!tracking)return;tracking=false;
    if(e.target.closest('#day-chart-scroll'))return;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    // Horizontal swipe, not vertical scroll
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.8){
      if(dx>0)chMonth(-1); // swipe right = previous month
      else chMonth(1);     // swipe left = next month
      hap('light');
    }
  },{passive:true});
}

function setupParallax(){
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return;ticking=true;
    requestAnimationFrame(()=>{
      const sg=document.getElementById('stats-grid');
      if(!sg){ticking=false;return;}
      const cards=sg.querySelectorAll('.sc');
      cards.forEach((card,i)=>{
        const rect=card.getBoundingClientRect();
        const center=window.innerHeight/2;
        const dist=(rect.top+rect.height/2)-center;
        const shift=dist*0.018*(i%2===0?1:-1);
        card.style.transform=`translateY(${shift}px)`;
      });
      ticking=false;
    });
  },{passive:true});
}

/* ══ PICK DATE FROM CHART ══ */
function pickDateFromChart(ds){
  hap('light');
  showTab('entry');
  selDate=ds;
  calY=parseInt(ds.split('-')[0]);
  calM=parseInt(ds.split('-')[1])-1;
  renderCal();updDateDisplay();updDayOffBtn();
  const dayEnts=entries.filter(e=>e.date===ds&&isReal(e));
  if(dayEnts.length===1)loadEdit(dayEnts[0]);
  else if(dayEnts.length>1)setTimeout(()=>{closeCal();showDayPicker(ds,dayEnts);},180);
}

/* ══ DAY DETAIL POPUP ══ */
let _dayDetailShown=null;
function showDayDetail(ds){
  hap('light');
  const existing=document.getElementById('day-detail-popup');
  if(existing&&_dayDetailShown===ds){existing.remove();_dayDetailShown=null;return;}
  if(existing)existing.remove();
  _dayDetailShown=ds;

  const dayEnts=entries.filter(e=>e.date===ds&&isReal(e));
  if(!dayEnts.length)return;

  const[y,m,d]=ds.split('-');
  const dateStr=parseInt(d)+' '+T.monthsFull[parseInt(m)-1]+' '+y;
  const total=dayEnts.reduce((s,e)=>s+e.total,0);
  const totalClients=dayEnts.reduce((s,e)=>s+(e.clients||0),0);

  const rows=dayEnts.map(e=>{
    const l=getLocById(e.locId)||{name:'?',icon:'',color:'#888'};
    return`<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--sep)">
      <div style="width:10px;height:10px;border-radius:50%;background:${l.color};flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700">${l.icon} ${l.name}</div>
        ${e.clients?`<div style="font-size:11px;color:var(--t2);margin-top:1px">${e.clients} ${uKl()} · ${fmt(e.revenue)} zł</div>`:''}
      </div>
      <div style="font-size:15px;font-weight:800;color:${l.color};flex-shrink:0">${fmt(e.total)} zł</div>
    </div>`;
  }).join('');

  const popup=document.createElement('div');
  popup.id='day-detail-popup';
  popup.style.cssText='position:fixed;bottom:calc(env(safe-area-inset-bottom)+70px);left:50%;transform:translateX(-50%);width:calc(100vw - 28px);max-width:480px;background:var(--card);border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.22);overflow:hidden;z-index:9000;animation:fadeUp .28s cubic-bezier(.34,1.2,.64,1)';
  popup.innerHTML=`
    <div style="padding:13px 16px 11px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--sep)">
      <div>
        <div style="font-size:15px;font-weight:800">${dateStr}</div>
        <div style="font-size:11px;color:var(--t2);margin-top:2px">${totalClients} ${T.clients.toLowerCase()}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:19px;font-weight:900;color:var(--green)">${fmt(total)} zł</div>
      </div>
    </div>
    ${rows}
    <div style="padding:10px 16px 14px;display:flex;gap:8px">
      <button onclick="document.getElementById('day-detail-popup').remove();_dayDetailShown=null"
        style="flex:1;padding:11px;border:none;border-radius:12px;background:var(--bg2);color:var(--t2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">${T.cancel}</button>
      <button onclick="pickDateFromChart('${ds}');document.getElementById('day-detail-popup')?.remove();_dayDetailShown=null"
        style="flex:2;padding:11px;border:none;border-radius:12px;background:var(--btn);color:var(--btn-fg);box-shadow:var(--btn-ring);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">
        ✏️ ${lang==='ru'?'Редактировать':lang==='pl'?'Edytuj':'Edit'}
      </button>
    </div>`;

  document.body.appendChild(popup);
  setTimeout(()=>{
    function h(e){
      const p=document.getElementById('day-detail-popup');
      if(p&&!p.contains(e.target)){p.remove();_dayDetailShown=null;document.removeEventListener('touchstart',h);document.removeEventListener('mousedown',h);}
    }
    document.addEventListener('touchstart',h,{passive:true});
    document.addEventListener('mousedown',h);
  },200);
}

function setupCanvasTouch(){
  let _touchStartX=null,_touchStartY=null,_timer=null;

  function getDay(clientX){
    const cv=document.getElementById('day-canvas');
    if(!cv||!cv._data)return null;
    const sc=document.getElementById('day-chart-scroll');
    const r=sc?sc.getBoundingClientRect():cv.getBoundingClientRect();
    const scrollLeft=sc?sc.scrollLeft:0;
    const px=(clientX-r.left)+scrollLeft;
    const d=cv._data;
    const day=Math.round((px-d.PAD.L)/d.DAY_W+0.5);
    return(day>=1&&day<=d.dim)?day:null;
  }

  function showTip(clientX){
    const cv=document.getElementById('day-canvas');
    if(!cv||!cv._data)return;
    const day=getDay(clientX);
    removeTip();
    if(!day)return;
    const d=cv._data;
    const{byDay,activeLocs,dark,dayOffArr}=d;
    const isOff=dayOffArr.includes(`${stM.y}-${p2(stM.m+1)}-${p2(day)}`);
    const data=byDay[day];
    if(!data&&!isOff)return;

    // Build HTML tooltip — fixed position, compact
    const sc=document.getElementById('day-chart-scroll');
    const scR=sc?sc.getBoundingClientRect():{top:0,left:0,right:0,bottom:0};

    let rows='';
    if(isOff){
      rows=`<div style="color:${dark?'#ff6b6b':'#c83232'};font-weight:700;font-size:12px">${lang==='ru'?'Выходной':lang==='pl'?'Dzień wolny':'Day off'}</div>`;
    } else if(data){
      const lHere=activeLocs.filter(l=>data.byLoc[l.id]);
      rows=lHere.map(l=>`
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
          <div style="width:8px;height:8px;border-radius:50%;background:${l.color};flex-shrink:0"></div>
          <span style="font-size:12px;color:${dark?'rgba(255,255,255,.75)':'rgba(0,0,0,.65)'}">${l.name.split(' ')[0]}</span>
          <span style="font-size:12px;font-weight:700;color:${l.color};margin-left:auto">${fmt(data.byLoc[l.id])} zł</span>
        </div>`).join('');
      if(lHere.length>1)
        rows+=`<div style="border-top:1px solid ${dark?'rgba(255,255,255,.1)':'rgba(0,0,0,.08)'};margin-top:5px;padding-top:5px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:${dark?'rgba(255,255,255,.9)':'rgba(0,0,0,.85)'}">
          <span>${lang==='ru'?'Итого':lang==='pl'?'Łącznie':'Total'}</span>
          <span>${fmt(data.total)} zł</span></div>`;
    }

    const tip=document.createElement('div');
    tip.id='chart-tip';
    tip.style.cssText=`
      position:fixed;
      z-index:9999;
      background:${dark?'rgba(22,22,30,.97)':'rgba(255,255,255,.98)'};
      border-radius:12px;
      padding:9px 12px;
      box-shadow:0 4px 24px rgba(0,0,0,${dark?.45:.18});
      border:1px solid ${dark?'rgba(255,255,255,.08)':'rgba(0,0,0,.07)'};
      min-width:140px;max-width:220px;
      pointer-events:none;
      animation:fadeUp .18s cubic-bezier(.34,1.2,.64,1);
    `;
    tip.innerHTML=`
      <div style="font-size:10.5px;font-weight:700;color:${dark?'rgba(255,255,255,.4)':'rgba(0,0,0,.38)'};margin-bottom:2px">${day} ${T.monthsFull[stM.m]}</div>
      ${rows}`;
    document.body.appendChild(tip);

    // Position: inside/above the chart area, close to tap point
    requestAnimationFrame(()=>{
      const tipH=tip.offsetHeight||80;
      const tipW=tip.offsetWidth||160;
      // Horizontal: center on tap, clamp to screen
      let left=clientX-tipW/2;
      if(left<8)left=8;
      if(left+tipW>window.innerWidth-8)left=window.innerWidth-tipW-8;
      // Vertical: just above bottom of chart, inside chart area
      const top=scR.bottom-tipH-16;
      tip.style.left=left+'px';
      tip.style.top=Math.max(scR.top+8,top)+'px';
    });

    clearTimeout(_timer);
    _timer=setTimeout(removeTip,3000);
  }

  function removeTip(){
    const t=document.getElementById('chart-tip');
    if(t)t.remove();
    clearTimeout(_timer);
  }

  // Tap detection via touchstart+touchend (doesn't block scroll)
  document.addEventListener('touchstart',function(e){
    const sc=document.getElementById('day-chart-scroll');
    if(!sc)return;
    const r=sc.getBoundingClientRect();
    const t=e.touches[0];
    if(t.clientY<r.top-5||t.clientY>r.bottom+5)return;
    _touchStartX=t.clientX;_touchStartY=t.clientY;
  },{passive:true});

  document.addEventListener('touchend',function(e){
    if(_touchStartX===null)return;
    const t=e.changedTouches[0];
    const dx=Math.abs(t.clientX-_touchStartX);
    const dy=Math.abs(t.clientY-_touchStartY);
    _touchStartX=null;_touchStartY=null;
    if(dx<12&&dy<12)showTip(t.clientX);
  },{passive:true});

  // Mouse
  document.addEventListener('click',function(e){
    const sc=document.getElementById('day-chart-scroll');
    if(!sc)return;
    const r=sc.getBoundingClientRect();
    if(e.clientY<r.top||e.clientY>r.bottom)return;
    showTip(e.clientX);
  });

  // Close on tap outside
  document.addEventListener('touchstart',function(e){
    const tip=document.getElementById('chart-tip');
    if(tip&&!tip.contains(e.target))removeTip();
  },{passive:true});
}


function hexAlphaJS(hex,a){
  try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
  catch{return'transparent'}
}
function getLocById(id){return locs.find(l=>l.id===id)}
function S(arr,k){return arr.reduce((s,e)=>s+(e[k]||0),0)}
function fmt(n){return Number(n||0).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtH(n){return n%1===0?String(n):Number(n).toFixed(1)}
function fmtD(s){const[,m,d]=s.split('-');return d+'.'+m}
function fmtDFull(s){const[y,m,d]=s.split('-');return`${parseInt(d)} ${T.monthsFull[parseInt(m)-1]} ${y}`}
function emptyH(){return`<div style="text-align:center;padding:24px 20px;color:var(--t3);font-size:13.5px;font-weight:600">${T.noData}</div>`}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>
