/* ══ iOS-STYLE DRUM PICKER ══ */
const DRUM_H=44;   // item height px — matches .drum-item-el height
const DRUM_VIS=3;  // visible items on each side of center
let drumKey='',drumItems=[],drumIdx=0;

function openDrum(key,min,max,current,step,unit){
  drumKey=key;drumItems=[];
  for(let v=min;v<=max;v=Math.round((v+step)*1e6)/1e6)drumItems.push(v);
  let best=0,bestDist=Infinity;
  drumItems.forEach((v,i)=>{const d=Math.abs(v-current);if(d<bestDist){bestDist=d;best=i}});
  drumIdx=best;
  document.getElementById('sheet-title').textContent=T.drumTitle;
  renderDrumBody(unit);openSheet();
}

function renderDrumBody(unit){
  document.getElementById('sheet-body').innerHTML=`
    <div class="drum-wrap" id="drum-wrap">
      <div class="drum-track" id="drum-track"></div>
      <div class="drum-sel-box"></div>
      <div class="drum-fade-t"></div>
      <div class="drum-fade-b"></div>
    </div>
    ${unit?`<div class="drum-unit">${unit}</div>`:''}
    <div class="drum-confirm-row">
      <button class="drum-cancel" onclick="closeSheet()">${T.cancel}</button>
      <button class="drum-ok" onclick="drumDone()">${T.done}</button>
    </div>`;
  drumRender(drumIdx,0);
  drumSetupTouch();
}

/* Center of picker = 130px from top of drum-wrap */
const DRUM_CENTER=130;

function drumOffsetForIdx(idx){
  // translateY so item[idx] is centered at DRUM_CENTER
  return DRUM_CENTER - idx*DRUM_H - DRUM_H/2;
}

function drumRender(centerIdx, extra){
  const track=document.getElementById('drum-track');
  if(!track)return;
  // Offset so centerIdx is at DRUM_CENTER
  const offset=drumOffsetForIdx(centerIdx)+extra;
  track.style.transform=`translateY(${offset}px)`;

  // Compute which item is actually centered given offset
  const actualCenter=Math.round((DRUM_CENTER-DRUM_H/2-offset)/DRUM_H);

  // Build all items with correct class
  let html='';
  for(let i=0;i<drumItems.length;i++){
    const dist=Math.abs(i-actualCenter);
    let cls='drum-item-el';
    if(dist===0) cls+=' center';
    else if(dist===1) cls+=' d1';
    const fmtV=drumItems[i]%1===0?String(drumItems[i]):drumItems[i].toFixed(1);
    html+=`<div class="${cls}">${fmtV}</div>`;
  }
  track.innerHTML=html;
}

function drumSnapTo(idx, vel){
  const finalIdx=Math.max(0,Math.min(drumItems.length-1,idx));
  if(finalIdx!==drumIdx) hap('selection');
  drumIdx=finalIdx;
  const track=document.getElementById('drum-track');
  if(!track)return;
  // Velocity-based spring duration
  const dist=Math.abs(parseFloat(track.style.transform.match(/translateY\(([^p]+)px\)/)?.[1]||0) - drumOffsetForIdx(drumIdx));
  const spd=Math.max(Math.abs(vel),200);
  const dur=Math.max(220,Math.min(500,dist/spd*1000));
  track.style.transition=`transform ${dur}ms cubic-bezier(.32,.72,0,1)`;
  track.style.transform=`translateY(${drumOffsetForIdx(drumIdx)}px)`;
  setTimeout(()=>{
    track.style.transition='none';
    drumRender(drumIdx,0);
  },dur+20);
}

function drumSetupTouch(){
  const wrap=document.getElementById('drum-wrap');
  if(!wrap)return;
  let startY=0,curOffset=0,vel=0,lastY=0,lastT=0,active=false,prevIdx=-1;

  function getOffset(){
    const t=document.getElementById('drum-track');
    if(!t)return drumOffsetForIdx(drumIdx);
    const m=t.style.transform.match(/translateY\(([^p]+)px\)/);
    return m?parseFloat(m[1]):drumOffsetForIdx(drumIdx);
  }
  function offsetToIdx(off){
    return Math.max(0,Math.min(drumItems.length-1,Math.round((DRUM_CENTER-DRUM_H/2-off)/DRUM_H)));
  }

  wrap.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.touches[0];
    startY=t.clientY;curOffset=getOffset();vel=0;lastY=startY;lastT=Date.now();active=true;prevIdx=drumIdx;
    const track=document.getElementById('drum-track');
    if(track)track.style.transition='none';
  },{passive:false});

  wrap.addEventListener('touchmove',e=>{
    if(!active)return;
    e.preventDefault();
    const t=e.touches[0];
    const dt=Math.max(Date.now()-lastT,1);
    vel=(t.clientY-lastY)/dt*1000;
    lastY=t.clientY;lastT=Date.now();
    const dy=t.clientY-startY;
    const newOff=curOffset+dy;
    // Elastic bounds
    const minOff=drumOffsetForIdx(drumItems.length-1)-DRUM_H;
    const maxOff=drumOffsetForIdx(0)+DRUM_H;
    let clamped=newOff;
    if(newOff<minOff) clamped=minOff+(newOff-minOff)*0.2;
    if(newOff>maxOff) clamped=maxOff+(newOff-maxOff)*0.2;
    const track=document.getElementById('drum-track');
    if(track) track.style.transform=`translateY(${clamped}px)`;
    // Live item highlighting
    const idx=offsetToIdx(clamped);
    if(idx!==prevIdx){hap('selection');prevIdx=idx;}
    drumRender(idx, clamped-drumOffsetForIdx(idx));
  },{passive:false});

  function onEnd(){
    if(!active)return;active=false;
    const off=getOffset();
    const momentum=vel*0.16;
    const targetOff=off+momentum;
    const idx=offsetToIdx(targetOff);
    drumSnapTo(idx,vel);
  }

  wrap.addEventListener('touchend',onEnd,{passive:true});
  wrap.addEventListener('touchcancel',onEnd,{passive:true});

  // Mouse support
  wrap.addEventListener('mousedown',e=>{
    startY=e.clientY;curOffset=getOffset();vel=0;lastY=startY;lastT=Date.now();active=true;prevIdx=drumIdx;
    const track=document.getElementById('drum-track');if(track)track.style.transition='none';
    const mm=ev=>{
      const dt=Math.max(Date.now()-lastT,1);vel=(ev.clientY-lastY)/dt*1000;lastY=ev.clientY;lastT=Date.now();
      const dy=ev.clientY-startY;const newOff=curOffset+dy;
      const track=document.getElementById('drum-track');if(track)track.style.transform=`translateY(${newOff}px)`;
      const idx=offsetToIdx(newOff);if(idx!==prevIdx){hap('selection');prevIdx=idx;}
      drumRender(idx,newOff-drumOffsetForIdx(idx));
    };
    const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);onEnd()};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
}

function setupSheetSwipe(){
  const box=document.getElementById('sheet-box');
  const ov=document.getElementById('sheet-ov');

  // Listen on overlay — catches ALL touches across the entire screen.
  // Drag activates as soon as finger moves DOWN by just 6px — very easy to trigger.
  let startY=0,startX=0,velY=0,lastY=0,lastT=0,isDragging=false,active=false;

  // Find the scrollable content inside the sheet
  function getScroller(target){
    let el=target;
    while(el&&el!==box){
      if(el.scrollHeight>el.clientHeight+2){
        const oy=getComputedStyle(el).overflowY;
        if(oy==='auto'||oy==='scroll')return el;
      }
      el=el.parentElement;
    }
    return null;
  }

  ov.addEventListener('touchstart',e=>{
    const r=box.getBoundingClientRect();
    const t=e.touches[0];
    if(t.clientX<r.left||t.clientX>r.right||t.clientY<r.top||t.clientY>r.bottom)return;
    startY=t.clientY;startX=t.clientX;
    lastY=startY;lastT=Date.now();
    velY=0;isDragging=false;active=true;
    // Remember if touch started in the top grab zone (first 60px = handle area)
    box._topZone=(t.clientY-r.top)<60;
    // Remember the scroller and its scroll position
    box._scroller=getScroller(t.target);
    box._wheel=!!(t.target.closest&&t.target.closest('.ap-wcol'));
  },{passive:true});

  ov.addEventListener('touchmove',e=>{
    if(!active)return;
    if(box._wheel){active=false;return}
    const t=e.touches[0];
    const dy=t.clientY-startY;
    const dx=Math.abs(t.clientX-startX);
    const dt=Math.max(Date.now()-lastT,1);
    velY=(t.clientY-lastY)/dt*1000;
    lastY=t.clientY;lastT=Date.now();

    if(!isDragging){
      // Only allow swipe-to-close if:
      // (a) touch started in top grab zone, OR
      // (b) there's no scroller, OR
      // (c) the scroller is already scrolled to the very top (can't scroll up more)
      const scroller=box._scroller;
      const atTop=!scroller||scroller.scrollTop<=0;
      const canDismiss=box._topZone||atTop;

      if(dy>10&&dy>dx*1.2&&canDismiss){
        isDragging=true;
        box.style.transition='none';
      } else if(dx>dy+10){
        active=false;return;
      } else if(dy>10&&!canDismiss){
        // User is scrolling content — don't hijack
        active=false;return;
      } else {
        return;
      }
    }

    if(dy>0){
      box.style.transform=`translateY(${dy}px)`;
    } else {
      box.style.transform=`translateY(${dy*0.04}px)`;
    }
  },{passive:true});

  function onEnd(e){
    if(!active)return;
    active=false;
    if(!isDragging){isDragging=false;return}
    isDragging=false;
    const t=e.changedTouches[0];
    const dy=t.clientY-startY;
    const momentum=velY*0.13;
    if(dy+momentum>60||velY>500){
      // Close — fast and smooth
      const spd=Math.max(Math.abs(velY),400);
      const remaining=Math.max(50,window.innerHeight-t.clientY);
      const dur=Math.max(130,Math.min(280,remaining/spd*1000));
      box.style.transition=`transform ${dur}ms cubic-bezier(.32,0,.67,0)`;
      box.style.transform='translateY(110%)';
      const scrollY=parseInt(document.body.style.top||'0')*-1;
      document.body.classList.remove('sheet-open');
      document.body.style.top='';
      window.scrollTo(0,scrollY);
      setTimeout(()=>{ov.classList.remove('open');box.style.transform='';},dur);
    } else {
      // Snap back with spring
      box.style.transition='transform .44s cubic-bezier(.34,1.25,.64,1)';
      box.style.transform='translateY(0)';
    }
  }

  ov.addEventListener('touchend',onEnd,{passive:true});
  ov.addEventListener('touchcancel',()=>{
    active=false;isDragging=false;
    box.style.transition='transform .44s cubic-bezier(.34,1.25,.64,1)';
    box.style.transform='translateY(0)';
  },{passive:true});
}

/* things below the fold glide up as they scroll into view (entry tab) */
function revealScan(){
  if(!('IntersectionObserver' in window))return;
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  if(!window._rvIO)window._rvIO=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting)return;
    const el=en.target;window._rvIO.unobserve(el);
    el.style.transitionDelay=(Math.min(window._rvN||0,4)*45)+'ms';window._rvN=(window._rvN||0)+1;
    requestAnimationFrame(()=>{el.classList.add('rv-in');setTimeout(()=>{el.classList.remove('rv','rv-in');el.style.transitionDelay='';window._rvN=0},900)});
  }),{rootMargin:'0px 0px -48px 0px',threshold:.04});
  const vh=window.innerHeight||800;
  document.querySelectorAll('#tab-entry .frow,#tab-entry .dsum,#tab-entry .dayoff-btn,#tab-entry .save-btn').forEach(el=>{
    if(el.classList.contains('rv'))return;
    if(el.getBoundingClientRect().top>vh-70){el.classList.add('rv');window._rvIO.observe(el)}
  });
}

/* numbers that count up when the Today tab opens */
function cuRun(root){
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  if(typeof requestAnimationFrame!=='function'||typeof performance==='undefined')return;
  root.querySelectorAll('[data-cu]').forEach(el=>{
    const to=parseFloat(el.dataset.cu);if(!isFinite(to)||to<=0)return;
    const fin=el.textContent,t0=performance.now(),D=650;
    const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);
      el.textContent=k>=1?fin:fmtZl(Math.round(to*e));if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

/* typical personal income for this weekday (last 12 weeks, ≥3 working days) */
function tdUsual(ts,dowIdx){
  const lim=new Date(ts+'T12:00:00');lim.setDate(lim.getDate()-84);const from=bkIso(lim),by={};
  entries.forEach(e=>{if(!isReal(e)||e.date>=ts||e.date<from)return;
    if((new Date(e.date+'T12:00:00').getDay()+6)%7!==dowIdx)return;
    by[e.date]=(by[e.date]||0)+(+e.myPctAmt||0)+(+e.tips||0)+(+e.tipsCash||0)});
  const v=Object.values(by).filter(x=>x>0);

function workdaysInMonth(y,m){let n=0;const last=new Date(y,m+1,0).getDate();

function dueDate(from){            // the 20th, moved to Monday when it falls on a weekend

function invBaseOfMonth(y,m){const pre=y+'-'+p2(m+1);return entries.filter(e=>isReal(e)&&!e.isReform&&String(e.date).startsWith(pre)).reduce((a,e)=>a+(e.total||0),0)}

function remPhone(raw){
  let d=String(raw||'').replace(/[^\d+]/g,'');

  if(!d)return '';
  if(!plus){if(d.startsWith('00'))d=d.slice(2);else if(d.length===9)d='48'+d}
  return d;
}
function bdParse(c){const m=/^(\d\d)-(\d\d)$/.exec(c&&c.bday||'');return m?{m:+m[1]-1,d:+m[2]}:null}
function bdDays(c,now){const b=bdParse(c);if(!b)return null;
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);let d=new Date(t.getFullYear(),b.m,b.d,12);
  if(d<t)d=new Date(t.getFullYear()+1,b.m,b.d,12);return Math.round((d-t)/864e5)}

function tdRecord(ts,earned){

/* ══ Schedule → daily entry link ══ */
/* What the calendar says about one day at one location: clients, worked hours, base for my %, discounts */
/* a booking that still counts as work: not a no-show and not cancelled */
/* Fresh form (no saved entry, nothing typed) on a day that has bookings → fill it from the calendar */

/* Per-(date+location) form state: unsaved input and calculator history survive switching locations */
let formDrafts={};
function draftKey(locIdx){const l=locs[locIdx];return(l&&selDate)?selDate+'|'+l.id:null}
function formHasData(){
  return !!(fVals.hours||fVals.clients||fVals.revenue||fVals.tips||fVals.tipsCash||fVals.vouchers||fVals.discounts||(fVals.notes&&String(fVals.notes).trim()));
}
function formSig(f,pct){
  return JSON.stringify([+f.hours||0,+f.clients||0,+f.revenue||0,+f.tips||0,+f.tipsCash||0,+f.vouchers||0,+f.discounts||0,String(f.notes||'').trim(),+pct||0]);
}
function stashDraft(locIdx){
  const k=draftKey(locIdx);if(!k)return;
  const noteEl=document.getElementById('fnote');if(noteEl)fVals.notes=noteEl.value;
  const loc=locs[locIdx];
  const saved=editId?entries.find(e=>e.id===editId):null;
  const exprs={...(window._fvalExpr||{})};
  // unchanged saved entry → nothing to stash (it loads from storage with its own history)
  if(saved&&formSig(fVals,curPct)===formSig(saved,saved.pct)&&JSON.stringify(exprs)===JSON.stringify(saved.exprs||{})){delete formDrafts[k];return}
  if(formHasData()||saved)formDrafts[k]={fVals:{...fVals},pct:curPct,exprs,editId:saved?saved.id:null};
  else delete formDrafts[k];
}
function applyFormState(fv,pct,exprs,eid){
  editId=eid||null;
  curPct=pct;
  fVals={hours:fv.hours||0,clients:fv.clients||0,revenue:fv.revenue||0,pct:pct,tips:fv.tips||0,tipsCash:fv.tipsCash||0,vouchers:fv.vouchers||0,discounts:fv.discounts||0,notes:fv.notes||''};
  window._fvalExpr={...(exprs||{})};
  const eb=document.getElementById('edit-banner');if(eb)eb.style.display=editId?'block':'none';
  st('save-btn',editId?T.saveEdit:T.save);
  document.getElementById('save-btn').classList.toggle('emode',!!editId);
  renderFormGroup();
}
function selLoc(i,fromUser){
  hap('light');
  if(fromUser&&i!==curLoc)stashDraft(curLoc);   // remember what was typed in the location we are leaving
  curLoc=i;
  // Update all pills: set active state + colors inline
  document.querySelectorAll('.loc-pill').forEach((p,j)=>{
    const l=locs[j];if(!l)return;
    p.classList.toggle('active',j===i);
    p.style.borderColor=j===i?l.color:'transparent';
    p.style.background=j===i?hexAlphaJS(l.color,.13):'';
    const nm=p.querySelector('.lp-name');
    if(nm)nm.style.color=j===i?l.color:'var(--t2)';
  });
  updPrevColor();

  if(selDate){
    const loc=locs[i];
    const existing=loc ? entries.find(e=>e.date===selDate&&e.locId===loc.id&&isReal(e)) : null;
    const dk=draftKey(i);
    const draft=(fromUser&&dk)?formDrafts[dk]:null;
    if(draft){
      // unsaved input for this date+location — restore it (including calculator history)
      const eid=(draft.editId&&entries.some(e=>e.id===draft.editId))?draft.editId:(existing?existing.id:null);
      applyFormState(draft.fVals,draft.pct,draft.exprs,eid);
      updDayOffBtn();updPrev();
      return;
    }
    if(existing && existing.id!==editId){
      // There's already a record for this loc on this date — load it WITH its calculator history
      applyFormState(existing,existing.pct||45,existing.exprs||(existing.revenueExpr?{revenue:existing.revenueExpr}:{}),existing.id);
      updDayOffBtn();updPrev();
      return;
    } else if(!existing){
      // No record for this loc on this date — start fresh (empty history too)
      const pct=loc&&loc.isReform?40:45;
      applyFormState({},pct,{},null);
      updDayOffBtn();updPrev();
      return;
    }
    // existing.id===editId means same record, just update loc visual
  }

  if(!editId){curPct=locs[i]&&locs[i].isReform?40:45;fVals.pct=curPct;renderFormGroup()}
  updDayOffBtn();
}

/* FIX #1: Colored calendar dots per location, multi-dot if multiple locations */
function renderCal(){
  if(_ecOpen)ecRender();
  document.getElementById('cal-ml').textContent=T.monthsFull[calM]+' '+calY;
  const _ch=document.getElementById('cal-hint');if(_ch)_ch.textContent='🌴 '+L3('Przytrzymaj dzień, aby oznaczyć dzień wolny','Удерживай день, чтобы отметить выходной','Press and hold a day to mark it as a day off');
  document.getElementById('cal-dw').innerHTML=T.dows.map(d=>`<div class="cal-dw">${d}</div>`).join('');
  const pfx=`${calY}-${p2(calM+1)}`;
  // Build map: date -> [locColors]
  const dateLocColors={};
  entries.filter(e=>e.date.startsWith(pfx)&&isReal(e)).forEach(e=>{
    const l=getLocById(e.locId)||locs[e.loc]||{color:'#ea580c'};
    if(!dateLocColors[e.date])dateLocColors[e.date]=[];
    if(!dateLocColors[e.date].includes(l.color))dateLocColors[e.date].push(l.color);
  });
  const todS=todayStr();
  const first=new Date(calY,calM,1).getDay();
  const offset=(first+6)%7;
  const dim=new Date(calY,calM+1,0).getDate();
  const prev=new Date(calY,calM,0).getDate();
  let h='';
  for(let i=0;i<offset;i++)h+=`<button class="cd cdo">${prev-offset+1+i}</button>`;
  for(let d=1;d<=dim;d++){
    const ds=`${calY}-${p2(calM+1)}-${p2(d)}`;
    const colors=dateLocColors[ds]||[];
    let c='cd';
    if(ds===todS)c+=' cd-today';
    if(ds===selDate)c+=' cd-sel';
    let dotHtml='';
    // Day off marker
    const isOff=isDayOff(ds);
    if(isOff)c+=' cdo';  // grey out
    if(colors.length===1){
      c+=' cd-has';
      dotHtml=`<span class="cd-dot2" style="background:${isOff?'var(--red)':colors[0]}"></span>`;
    } else if(colors.length>1){
      c+=' cd-has-multi';
      const miniDots=colors.slice(0,3).map(col=>`<span style="width:4px;height:4px;border-radius:50%;background:${col};display:inline-block"></span>`).join('');
      dotHtml=`<span class="cd-dot2-multi" style="display:flex;gap:1.5px;position:absolute;bottom:2px;left:50%;transform:translateX(-50%)">${miniDots}</span>`;
    }
    h+=`<button class="${c}" data-ds="${ds}" onclick="pickDate('${ds}')">${d}${dotHtml}</button>`;
  }
  document.getElementById('cal-days').innerHTML=h;
}

/* FIX #2: Save uses selDate (which can be changed by user picking a new date in edit mode) */
function saveEntry(){
  if(!selDate){showToast(T.selectDate);return}
  const noteEl=document.getElementById('fnote');if(noteEl)fVals.notes=noteEl.value;
  const loc=locs[curLoc];
  const entry={
    id:editId||Date.now(),
    date:selDate,
    loc:curLoc,locId:loc?loc.id:0,
    hours:fVals.hours,clients:fVals.clients,revenue:fVals.revenue,
    pct:curPct,tips:fVals.tips,tipsCash:fVals.tipsCash||0,vouchers:fVals.vouchers,discounts:fVals.discounts,notes:fVals.notes,
    myPctAmt:fVals.revenue*curPct/100,total:(fVals.revenue*curPct/100)+fVals.tips,
    realTotal:(fVals.revenue*curPct/100)+fVals.tips+(fVals.tipsCash||0),
    isReform:loc?loc.isReform:false,
    exprs:window._fvalExpr?{...window._fvalExpr}:{},
  };
  if(editId){
    // Check: if loc changed and another entry already exists for this new loc+date — overwrite that one
    const existingForLoc=entries.find(e=>e.date===selDate&&e.locId===entry.locId&&e.id!==editId&&isReal(e));
    if(existingForLoc){
      // Merge: remove the conflicting entry, update current
      entries=entries.filter(e=>e.id!==existingForLoc.id);
    }
    entries=entries.map(e=>e.id===editId?entry:e);
    showToast(T.updated);
  } else {
    // New entry — check if one already exists for this loc+date
    const dup=entries.find(e=>e.date===selDate&&e.locId===entry.locId&&isReal(e));
    if(dup){
      // Update existing instead of duplicating
      entry.id=dup.id;
      entries=entries.map(e=>e.id===dup.id?entry:e);
      showToast(T.updated);
    } else {
      entries.push(entry);
      showToast(T.saved);
    }
  }
  entries.sort((a,b)=>a.date.localeCompare(b.date));
  delete formDrafts[selDate+'|'+entry.locId];
  hap('medium');saveAll();cancelEdit();updDateDisplay();renderCal();
}

  const tCard=fVals.tips||0,tCash=fVals.tipsCash||0;
  const invoice=p+tCard;            // goes to invoice (card tips are paid via terminal)
  const real=invoice+tCash;         // real personal income of this entry
  const $=id=>document.getElementById(id);
  const set=(id,t)=>{const el=$(id);if(el)el.textContent=t};
  const loc=locs[curLoc];
  set('ds-lreal',L3('Mój dochód za dzień','Мой доход за день','My income today'));
  set('pv-l1',L3('Mój % od obrotu','Мой % от оборота','My % of revenue')+(curPct?' · '+curPct+'%':''));
  set('pv-l2',L3('Napiwki — terminal','Чаевые — терминал','Tips — card'));
  set('ds-lcash',L3('Napiwki — gotówka','Чаевые — наличные','Tips — cash'));
  set('pv-real',fmt(real)+' zł');
  const big=$('pv-real');if(big)big.classList.toggle('pos',real>0);
  set('pv-pct',fmt(p)+' zł');set('pv-tips',fmt(tCard)+' zł');set('pv-cash',fmt(tCash)+' zł');
  [['pv-pct',p],['pv-tips',tCard],['pv-cash',tCash]].forEach(([id,v])=>{const r=$(id)&&$(id).parentNode;if(r)r.classList.toggle('zero',!(v>0))});
  // proportion bar
  const bar=$('ds-bar');
  if(bar){const w=[p,tCard,tCash].map(v=>real>0&&v>0?v/real*100:0);
    ['b1','b2','b3'].forEach((c,i)=>{const el=bar.querySelector('.'+c);if(el)el.style.width=w[i]+'%'})}
  // KPI chips
  const k=[];
  if(real>0&&fVals.hours>0)k.push([fmt(real/fVals.hours),L3('zł / godz.','zł / час','zł / hour')]);
  if(fVals.revenue>0&&fVals.clients>0)k.push([fmt(fVals.revenue/fVals.clients),L3('śr. na klienta','средний чек','avg / client')]);
  if((tCard+tCash)>0&&fVals.revenue>0)k.push([String(Math.round((tCard+tCash)/fVals.revenue*1000)/10).replace('.',',')+'%',L3('napiwki / obrót','чаевые / оборот','tips / revenue')]);
  const ke=$('ds-kpis');
  if(ke){ke.style.display=k.length?'':'none';ke.innerHTML=k.map(x=>'<div class="ds-k"><b>'+apEsc(x[0])+'</b><span>'+apEsc(x[1])+'</span></div>').join('')}
  // comparison with the usual for this weekday (whole day = this entry + other locations that day)
  const ce=$('ds-cmp');
  if(ce){
    let html='';
    try{
      if(real>0&&selDate){
        const others=entries.filter(e=>e.date===selDate&&isReal(e)&&e.id!==editId&&(loc?e.locId!==loc.id:true))
          .reduce((a,e)=>a+(+e.myPctAmt||0)+(+e.tips||0)+(+e.tipsCash||0),0);
        const day=real+others;
        const dow=(new Date(selDate+'T12:00:00').getDay()+6)%7;
        const us=tdUsual(selDate,dow);
        if(others>0)html+='<span>'+apEsc(L3('Cały dzień','Весь день','Whole day'))+' <b style="display:inline;font-size:12px;color:var(--t1)">'+apEsc(fmt(day))+' zł</b></span>';
        if(us&&us.avg>0){const df=Math.round((day/us.avg-1)*100);
          html+='<b class="'+(df>=0?'up':'dn')+'">'+(df>=0?'▲ +':'▼ ')+df+'%</b><small>'+apEsc(L3('vs typowy','к обычному','vs usual')+' '+TDDOWIN[lang][dow])+'</small><small style="white-space:nowrap">≈ '+apEsc(fmt(us.avg))+' zł</small>';}
      }
    }catch(_){html=''}
    ce.innerHTML=html;ce.style.display=html?'':'none';
  }
  // invoice line
  const inv=$('ds-inv');
  if(inv){
    if(loc&&loc.isReform){set('pv-l3',L3('Reform — poza fakturą','Reform — не в фактуру','Reform — not invoiced'));set('pv-tot','—')}
    else{$('pv-l3').innerHTML='🧾 '+apEsc(L3('Do faktury','В фактуру','To invoice'))+' <small style="color:var(--t3);font-weight:600">'+apEsc(L3('% + napiwki z terminala','% + чаевые терминала','% + card tips'))+'</small>';set('pv-tot',fmt(invoice)+' zł')}
  }
}

// sepLocs = locations with isReform=true (separate from invoice)
function getSepLocIds(){return locs.filter(l=>l.isReform).map(l=>l.id)}
function isSepEntry(e){return getSepLocIds().includes(e.locId)}
function mEnts({y,m},exSep){
  const pfx=`${y}-${p2(m+1)}`;
  return entries.filter(e=>e.date.startsWith(pfx)&&isReal(e)&&!(exSep&&isSepEntry(e)));
}
function rEnts({y,m}){
  const pfx=`${y}-${p2(m+1)}`;
  const sepIds=getSepLocIds();
  return entries.filter(e=>e.date.startsWith(pfx)&&isReal(e)&&sepIds.includes(e.locId));
}
function rEntsY(y){
  const sepIds=getSepLocIds();
  return entries.filter(e=>e.date.startsWith(String(y))&&isReal(e)&&sepIds.includes(e.locId));
}

/* Tips by month chart (card vs cash) — animated gradient columns */
function renderTipsChart(year){
  const host=document.getElementById('tips-chart');if(!host)return;
  const sl=document.getElementById('sl-tipschart');
  if(sl)sl.textContent=lang==='ru'?'Чаевые по месяцам':lang==='pl'?'Napiwki wg miesięcy':'Tips by month';
  const lc=document.getElementById('tips-leg-card'),lh=document.getElementById('tips-leg-cash');
  if(lc)lc.textContent=lang==='ru'?'Карта':lang==='pl'?'Karta':'Card';
  if(lh)lh.textContent=lang==='ru'?'Наличка':lang==='pl'?'Gotówka':'Cash';
  const card=[],cash=[];
  for(let m=0;m<12;m++){
    const me=entries.filter(e=>e.date.startsWith(`${year}-${p2(m+1)}`)&&isReal(e));
    card.push(S(me,'tips'));cash.push(S(me,'tipsCash'));
  }
  const totCard=card.reduce((a,b)=>a+b,0),totCash=cash.reduce((a,b)=>a+b,0);
  if(totCard+totCash===0){host.innerHTML=`<div style="text-align:center;color:var(--t3);font-size:13px;padding:14px 0">${lang==='ru'?'Нет чаевых за год':lang==='pl'?'Brak napiwków':'No tips yet'}</div>`;return}
  const monthTot=card.map((c,i)=>c+cash[i]);
  const bestI=monthTot.reduce((bi,v,i)=>v>monthTot[bi]?i:bi,0);
  const summary=`<div style="display:flex;justify-content:space-around;margin-top:12px;padding-top:11px;border-top:1px solid var(--sep)">
      <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--blue)">${fmt(totCard)} zł</div><div style="font-size:10px;color:var(--t3);font-weight:600">${lang==='ru'?'Карта за год':lang==='pl'?'Karta':'Card'}</div></div>
      <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--green)">${fmt(totCash)} zł</div><div style="font-size:10px;color:var(--t3);font-weight:600">${lang==='ru'?'Наличка за год':lang==='pl'?'Gotówka':'Cash'}</div></div>
      <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--blue)">${fmt(totCard+totCash)} zł</div><div style="font-size:10px;color:var(--t3);font-weight:600">${lang==='ru'?'Всего':lang==='pl'?'Razem':'Total'}</div></div>
    </div>`;
  const sc=chartScaffold(host,'',summary);
  const cssH=190;
  const d=sizeScrollChart(sc,12,46,cssH);
  const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  const txt=dark?'rgba(255,255,255,.45)':'rgba(0,0,0,.4)';
  const niceMax=niceCeil(Math.max(...card,...cash,1));
  const blue=cssVar('--blue','#2563eb'),green=cssVar('--green','#16a34a');
  const ringColor=dark?'#1e1e26':'#fff';
  const yOf=v=>d.baseY-(v/niceMax)*d.plotH;
  const drawSeries=(arr,color,prog)=>{
    const pts=[];for(let m=0;m<12;m++)pts.push([d.px(m),d.baseY-(d.baseY-yOf(arr[m]))*prog]);
    // area
    const grad=d.pctx.createLinearGradient(0,d.padT,0,d.baseY);
    grad.addColorStop(0,hexAlpha(color,.22));grad.addColorStop(.6,hexAlpha(color,.07));grad.addColorStop(1,hexAlpha(color,0));
    d.pctx.beginPath();smoothPath(d.pctx,pts);
    d.pctx.lineTo(d.px(11),d.baseY);d.pctx.lineTo(d.px(0),d.baseY);d.pctx.closePath();
    d.pctx.fillStyle=grad;d.pctx.fill();
    // line
    d.pctx.beginPath();smoothPath(d.pctx,pts);
    d.pctx.strokeStyle=color;d.pctx.lineWidth=2.4;d.pctx.lineJoin='round';d.pctx.lineCap='round';d.pctx.setLineDash([]);d.pctx.stroke();
  };
  const draw=(prog)=>{
    drawAxes(d,niceMax,dark);
    drawSeries(cash,green,prog);
    drawSeries(card,blue,prog);
    // month labels
    d.pctx.textBaseline='alphabetic';d.pctx.fillStyle=txt;d.pctx.font='9px Outfit,sans-serif';d.pctx.textAlign='center';
    for(let m=0;m<12;m++)d.pctx.fillText(T.monthsShort[m].slice(0,3),d.px(m),d.cssH-8);
    if(prog>=1){
      const pts=[];
      for(let m=0;m<12;m++){if(card[m]>0||cash[m]>0)pts.push({x:d.px(m),y:yOf(Math.max(card[m],cash[m])),html:`${T.monthsFull[m]}<br><b style="color:#60a5fa">${lang==='ru'?'Карта':lang==='pl'?'Karta':'Card'}:</b> ${fmt(card[m])} zł<br><b style="color:#4ade80">${lang==='ru'?'Наличка':lang==='pl'?'Gotówka':'Cash'}:</b> ${fmt(cash[m])} zł`})}
      sc.plot._pts=pts;
    }
  };
  animateChart('_tipsAnim',draw);
  attachChartTip(sc.plot);
}

/* Clients by month — smooth area line + calm forecast (Booksy style) */
function renderClientsChart(year){
  const host=document.getElementById('clients-chart');if(!host)return;
  const sl=document.getElementById('sl-clientschart');
  if(sl)sl.textContent=lang==='ru'?'Клиенты по месяцам':lang==='pl'?'Klienci wg miesięcy':'Clients by month';
  const cl=[];
  for(let m=0;m<12;m++){
    const me=entries.filter(e=>e.date.startsWith(`${year}-${p2(m+1)}`)&&isReal(e));
    cl.push(S(me,'clients'));
  }
  const tot=cl.reduce((a,b)=>a+b,0);
  if(tot===0){host.innerHTML=`<div style="text-align:center;color:var(--t3);font-size:13px;padding:14px 0">${lang==='ru'?'Нет данных за год':lang==='pl'?'Brak danych':'No data yet'}</div>`;return}
  const bestI=cl.reduce((bi,v,i)=>v>cl[bi]?i:bi,0);
  const activeMonths=cl.filter(v=>v>0).length;
  const avg=activeMonths?tot/activeMonths:0;

  // ── CALM FORECAST: ease toward recent average (no runaway growth) ──
  const nowY=NOW.getFullYear(),nowM=NOW.getMonth();
  const inProgM=(year===nowY)?nowM:-1;
  let lastActual=-1;for(let m=0;m<12;m++)if(cl[m]>0)lastActual=m;
  // recent active months (exclude in-progress), take last 3
  let recent=[];for(let m=0;m<12;m++){if(cl[m]>0&&m!==inProgM)recent.push(cl[m])}
  if(recent.length===0)for(let m=0;m<12;m++)if(cl[m]>0)recent.push(cl[m]);
  const recent3=recent.slice(-3);
  const base=recent3.reduce((a,b)=>a+b,0)/recent3.length;
  const lastVal=lastActual>=0?cl[lastActual]:base;
  const fc={};const fcStart=lastActual+1,fcEnd=Math.min(11,lastActual+3);
  for(let k=1;k<=fcEnd-fcStart+1;k++){
    const m=lastActual+k;
    // ease from last value toward recent average, settle quickly
    fc[m]=Math.max(0,Math.round(base+(lastVal-base)*Math.pow(0.45,k)));
  }
  const hasFc=fcEnd>=fcStart&&lastActual>=0;
  const nextFcMonth=hasFc?fcStart:-1;
  const thirdStat=hasFc
    ?`<div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--blue)">~${fc[nextFcMonth]}</div><div style="font-size:10px;color:var(--t3);font-weight:600">${(lang==='ru'?'Прогноз ':lang==='pl'?'Prognoza ':'Forecast ')+T.monthsShort[nextFcMonth]}</div></div>`
    :`<div style="text-align:center"><div style="font-size:15px;font-weight:900">${cl[bestI]}</div><div style="font-size:10px;color:var(--t3);font-weight:600">${(lang==='ru'?'Топ ':lang==='pl'?'Top ':'Top ')+T.monthsShort[bestI]}</div></div>`;

  const legend=`<div style="display:flex;gap:14px;margin-bottom:10px;justify-content:center">
      <div style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:3px;border-radius:2px;background:var(--blue)"></span><span style="font-size:11px;font-weight:700;color:var(--t2)">${lang==='ru'?'Факт':lang==='pl'?'Fakt':'Actual'}</span></div>
      ${hasFc?`<div style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:0;border-top:2px dashed var(--blue);opacity:.6"></span><span style="font-size:11px;font-weight:700;color:var(--t2)">${lang==='ru'?'Прогноз':lang==='pl'?'Prognoza':'Forecast'}</span></div>`:''}
    </div>`;
  const summary=`<div style="display:flex;justify-content:space-around;margin-top:12px;padding-top:11px;border-top:1px solid var(--sep)">
      <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--blue)">${tot}</div><div style="font-size:10px;color:var(--t3);font-weight:600">${lang==='ru'?'Всего':lang==='pl'?'Razem':'Total'}</div></div>
      <div style="text-align:center"><div style="font-size:15px;font-weight:900">${fmt(avg)}</div><div style="font-size:10px;color:var(--t3);font-weight:600">${lang==='ru'?'Ср./месяц':lang==='pl'?'Śr./mies.':'Avg/mo'}</div></div>
      ${thirdStat}
    </div>`;
  const sc=chartScaffold(host,legend,summary);
  const cssH=190;
  const d=sizeScrollChart(sc,12,46,cssH);
  const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  const txt=dark?'rgba(255,255,255,.45)':'rgba(0,0,0,.4)';
  const fcVals=Object.values(fc);
  const niceMax=niceCeil(Math.max(...cl,...(fcVals.length?fcVals:[0]),1));
  const blue=cssVar('--blue','#2563eb');
  const yOf=v=>d.baseY-(v/niceMax)*d.plotH;
  const upTo=lastActual<0?11:lastActual;
  const draw=(prog)=>{
    drawAxes(d,niceMax,dark);
    const yA=v=>d.baseY-(d.baseY-yOf(v))*prog;
    const aPts=[];for(let m=0;m<=upTo;m++)aPts.push([d.px(m),yA(cl[m])]);
    // area fill (soft fade)
    const grad=d.pctx.createLinearGradient(0,d.padT,0,d.baseY);
    grad.addColorStop(0,hexAlpha(blue,.34));grad.addColorStop(.55,hexAlpha(blue,.12));grad.addColorStop(1,hexAlpha(blue,0));
    d.pctx.beginPath();smoothPath(d.pctx,aPts);
    d.pctx.lineTo(d.px(upTo),d.baseY);d.pctx.lineTo(d.px(0),d.baseY);d.pctx.closePath();
    d.pctx.fillStyle=grad;d.pctx.fill();
    // actual smooth line
    d.pctx.beginPath();smoothPath(d.pctx,aPts);
    d.pctx.strokeStyle=blue;d.pctx.lineWidth=2.6;d.pctx.lineJoin='round';d.pctx.lineCap='round';d.pctx.setLineDash([]);d.pctx.stroke();
    // forecast dashed (same color), smooth
    if(hasFc){
      const fPts=[[d.px(lastActual),yA(cl[lastActual])]];
      for(let m=fcStart;m<=fcEnd;m++)fPts.push([d.px(m),yA(fc[m])]);
      d.pctx.beginPath();smoothPath(d.pctx,fPts);
      d.pctx.strokeStyle=blue;d.pctx.globalAlpha=.55;d.pctx.lineWidth=2.6;d.pctx.setLineDash([5,5]);d.pctx.stroke();
      d.pctx.setLineDash([]);d.pctx.globalAlpha=1;
    }
    // single dot at transition
    if(lastActual>=0){
      const dx=d.px(lastActual),dy=yA(cl[lastActual]);
      d.pctx.beginPath();d.pctx.arc(dx,dy,4.5,0,Math.PI*2);d.pctx.fillStyle=blue;d.pctx.fill();
      d.pctx.lineWidth=2.5;d.pctx.strokeStyle=dark?'#1e1e26':'#fff';d.pctx.stroke();
    }
    // month labels
    d.pctx.textBaseline='alphabetic';d.pctx.fillStyle=txt;d.pctx.font='9px Outfit,sans-serif';d.pctx.textAlign='center';
    for(let m=0;m<12;m++)d.pctx.fillText(T.monthsShort[m].slice(0,3),d.px(m),d.cssH-8);
    if(prog>=1){
      const pts=[];
      for(let m=0;m<=upTo;m++)pts.push({x:d.px(m),y:yA(cl[m]),html:`${T.monthsFull[m]}<br><b>${cl[m]} ${lang==='ru'?'клиентов':lang==='pl'?'klientów':'clients'}</b>`});
      if(hasFc)for(let m=fcStart;m<=fcEnd;m++)pts.push({x:d.px(m),y:yA(fc[m]),html:`${T.monthsFull[m]} · ${lang==='ru'?'прогноз':lang==='pl'?'prognoza':'forecast'}<br><b>~${fc[m]} ${lang==='ru'?'клиентов':lang==='pl'?'klientów':'clients'}</b>`});
      sc.plot._pts=pts;
    }
  };
  animateChart('_clientsAnim',draw);
  attachChartTip(sc.plot);
}

/* ══════════ BOOKSY-STYLE METRIC CAROUSEL ══════════ */
let bkPeriod='month',bkMetric=0,bkRef=new Date(NOW);
function bkIso(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function bkSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function bkBuckets(period,ref){
  let buckets=[],selIdx=0,horizon=3,isCur=false,navLabel='';
  if(period==='day'){
    const r=new Date(ref);r.setHours(0,0,0,0);
    isCur=bkSameDay(r,NOW);
    for(let i=13;i>=0;i--){const d=new Date(r);d.setDate(r.getDate()-i);const ds=bkIso(d);buckets.push({label:d.getDate()+' '+T.monthsShort[d.getMonth()],test:x=>x===ds})}
    selIdx=13;
    if(isCur)for(let k=1;k<=3;k++){const d=new Date(r);d.setDate(r.getDate()+k);buckets.push({label:d.getDate()+' '+T.monthsShort[d.getMonth()],future:true,test:()=>false})}
    horizon=3;
    navLabel=r.getDate()+' '+T.monthsFull[r.getMonth()]+(r.getFullYear()!==NOW.getFullYear()?' '+r.getFullYear():'');
  }else if(period==='week'){
    const r=new Date(ref);r.setHours(0,0,0,0);const dow=(r.getDay()+6)%7;const mon=new Date(r);mon.setDate(r.getDate()-dow);
    const curDow=(NOW.getDay()+6)%7;const curMon=new Date(NOW);curMon.setDate(NOW.getDate()-curDow);curMon.setHours(0,0,0,0);
    isCur=bkSameDay(mon,curMon);
    for(let i=7;i>=0;i--){const s=new Date(mon);s.setDate(mon.getDate()-i*7);const e=new Date(s);e.setDate(s.getDate()+6);const ss=bkIso(s),es=bkIso(e);buckets.push({label:s.getDate()+' '+T.monthsShort[s.getMonth()],test:x=>x>=ss&&x<=es})}
    selIdx=7;
    if(isCur)for(let k=1;k<=2;k++){const s=new Date(mon);s.setDate(mon.getDate()+k*7);buckets.push({label:s.getDate()+' '+T.monthsShort[s.getMonth()],future:true,test:()=>false})}
    horizon=2;
    const we=new Date(mon);we.setDate(mon.getDate()+6);
    navLabel=mon.getDate()+'–'+we.getDate()+' '+T.monthsShort[we.getMonth()];
  }else if(period==='year'){
    const yrs=entries.map(e=>+e.date.slice(0,4));const refY=ref.getFullYear();
    const minY=Math.min(NOW.getFullYear(),refY,...(yrs.length?yrs:[NOW.getFullYear()]));
    const maxY=Math.max(NOW.getFullYear(),refY);
    for(let y=minY;y<=maxY;y++)buckets.push({label:''+y,test:x=>x.startsWith(''+y)});
    selIdx=refY-minY;
    isCur=(refY===NOW.getFullYear());
    if(isCur)for(let k=1;k<=2;k++)buckets.push({label:''+(NOW.getFullYear()+k),future:true,test:()=>false});
    horizon=2;
    navLabel=''+refY;
  }else{ // month — 12 months of ref's year
    const y=ref.getFullYear();
    for(let m=0;m<12;m++){const mm=p2(m+1);buckets.push({label:T.monthsShort[m],test:x=>x.startsWith(`${y}-${mm}`)})}
    selIdx=ref.getMonth();
    isCur=(y===NOW.getFullYear()&&ref.getMonth()===NOW.getMonth());
    horizon=3;
    navLabel=T.monthsFull[ref.getMonth()]+' '+y;
  }
  return{buckets,selIdx,horizon,isCur,navLabel};
}
function bkSum(buckets,getter){
  const real=entries.filter(isReal);
  return buckets.map(b=>b.future?0:real.reduce((s,e)=>s+(b.test(e.date)?(getter(e)||0):0),0));
}
function bkForecast(values,horizon,len){
  let lastActual=-1;for(let i=0;i<len;i++)if(values[i]>0&&!isNaN(values[i]))lastActual=i;
  const out={fromIdx:lastActual,map:{}};
  if(lastActual<0)return out;
  let recent=[];for(let i=0;i<=lastActual;i++)if(values[i]>0)recent.push(values[i]);
  const r3=recent.slice(-3);const base=r3.reduce((a,b)=>a+b,0)/r3.length;const lastVal=values[lastActual];
  const end=Math.min(len-1,lastActual+horizon);
  for(let k=1;lastActual+k<=end;k++)out.map[lastActual+k]=Math.max(0,base+(lastVal-base)*Math.pow(0.45,k));
  return out;
}
const BK_METRICS=()=>[
  {key:'turnover',title:lang==='ru'?'Оборот':lang==='pl'?'Obrót':'Turnover',color:cssVar('--blue','#2563eb'),money:true,get:e=>e.revenue||0},
  {key:'income',title:lang==='ru'?'Доход':lang==='pl'?'Przychód':'Income',color:cssVar('--green','#16a34a'),money:true,get:e=>(e.realTotal!=null?e.realTotal:e.total)},
  {key:'clients',title:lang==='ru'?'Клиенты':lang==='pl'?'Klienci':'Clients',color:cssVar('--orange','#ea580c'),money:false,get:e=>e.clients||0},
  {key:'tips',title:lang==='ru'?'Чаевые':lang==='pl'?'Napiwki':'Tips',color:cssVar('--purple','#7c3aed'),money:true,get:e=>(e.tips||0)+(e.tipsCash||0)},
];
function renderBooksy(){
  const tabsEl=document.getElementById('bk-tabs');if(!tabsEl)return;
  st('sl-detailed',lang==='ru'?'Подробнее':lang==='pl'?'Szczegóły':'Details');
  const periods=[['day',lang==='ru'?'День':lang==='pl'?'Dzień':'Day'],['week',lang==='ru'?'Неделя':lang==='pl'?'Tydzień':'Week'],['month',lang==='ru'?'Месяц':lang==='pl'?'Miesiąc':'Month'],['year',lang==='ru'?'Год':lang==='pl'?'Rok':'Year'],['all',lang==='ru'?'Всё':lang==='pl'?'Wszystko':'All']];
  tabsEl.innerHTML=periods.map(([p,l])=>`<button class="ptab${bkPeriod===p?' active':''}" onclick="setBkPeriod('${p}')">${l}</button>`).join('');

  const nav=document.getElementById('bk-nav');
  const pager=document.getElementById('bk-pager');
  const dots=document.getElementById('bk-dots');

  // "All" has no single bucket to compare against — skip carousel + nav entirely
  if(bkPeriod==='all'){
    nav.innerHTML='';pager.innerHTML='';dots.innerHTML='';
    return;
  }

  const {buckets,selIdx,horizon,isCur,navLabel}=bkBuckets(bkPeriod,bkRef);
  // nav row ‹ label ›
  const canFwd=!isCur;
  nav.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 11px">
    <button onclick="bkNav(-1)" class="mnav-btn" style="width:30px;height:30px">‹</button>
    <span style="font-size:14px;font-weight:800;min-width:130px;text-align:center">${navLabel}${isCur?' ·<span style="color:var(--blue)"> '+L3('teraz','сейчас','now')+'</span>':''}</span>
    <button onclick="bkNav(1)" class="mnav-btn" style="width:30px;height:30px;${canFwd?'':'opacity:.3;pointer-events:none'}">›</button>
  </div>`;
  const metrics=BK_METRICS();
  pager.innerHTML=metrics.map((mt,mi)=>`<div class="bk-card card"><div id="bk-card-${mi}"></div></div>`).join('');
  metrics.forEach((mt,mi)=>{
    const vals=bkSum(buckets,mt.get);
    const cur=vals[selIdx]||0;const prev=selIdx>0?(vals[selIdx-1]||0):0;
    const pct=(prev>0&&cur>0)?Math.round((cur-prev)/prev*100):null;
    const fcast=isCur?bkForecast(vals,horizon,buckets.length):{fromIdx:-1,map:{}};
    const host=document.getElementById('bk-card-'+mi);
    const pctHtml=pct===null?'':`<span style="font-size:13px;font-weight:800;color:${pct>=0?'var(--green)':'var(--red)'};margin-left:8px">${pct>=0?'▲':'▼'} ${Math.abs(pct)}%</span>`;
    const valStr=mt.money?fmt(cur)+' zł':String(Math.round(cur));
    host.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--t2)">${mt.title}</div>
      <div style="display:flex;align-items:baseline;margin:2px 0 12px"><span style="font-size:27px;font-weight:900;letter-spacing:-1px;color:${mt.color}">${valStr}</span>${pctHtml}</div>
      <canvas class="bk-canvas" style="display:block;width:100%"></canvas>`;
    const cv=host.querySelector('.bk-canvas');
    drawMetricChart(cv,buckets,vals,selIdx,fcast,mt);
  });
  dots.innerHTML=metrics.map((_,i)=>`<span class="bk-dot${i===bkMetric?' on':''}"></span>`).join('');
  requestAnimationFrame(()=>{const cw=pager.clientWidth||pager.offsetWidth||1;pager.scrollLeft=bkMetric*cw;});
  pager.onscroll=()=>{const cw=pager.clientWidth||1;const idx=Math.round(pager.scrollLeft/cw);if(idx!==bkMetric){bkMetric=Math.max(0,Math.min(metrics.length-1,idx));[...dots.children].forEach((dd,i)=>dd.classList.toggle('on',i===bkMetric))}};
}
function setBkPeriod(p){bkPeriod=p;renderStats();hap('selection')}
function bkNav(dir){
  if(bkPeriod==='all')return; // no single timeline to page through
  const r=new Date(bkRef);
  if(bkPeriod==='day')r.setDate(r.getDate()+dir);
  else if(bkPeriod==='week')r.setDate(r.getDate()+dir*7);
  else if(bkPeriod==='month')r.setMonth(r.getMonth()+dir);
  else r.setFullYear(r.getFullYear()+dir);
  if(dir>0&&r>NOW)return; // don't go into the future
  bkRef=r;renderStats();hap('selection');
}
function drawMetricChart(cv,buckets,values,selIdx,fcast,mt){
  const n=buckets.length;
  const dpr=window.devicePixelRatio||1;
  const cssW=cv.clientWidth||cv.offsetWidth||320,cssH=170;
  cv.width=cssW*dpr;cv.height=cssH*dpr;cv.style.height=cssH+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  const grid=dark?'rgba(255,255,255,.06)':'rgba(0,0,0,.045)';
  const txt=dark?'rgba(255,255,255,.45)':'rgba(0,0,0,.4)';
  const padL=30,padR=12,padT=14,padB=22;
  const plotW=cssW-padL-padR,plotH=cssH-padT-padB,baseY=padT+plotH;
  const fcVals=Object.values(fcast.map);
  const niceMax=niceCeil(Math.max(...values.filter(v=>!isNaN(v)),...(fcVals.length?fcVals:[0]),1));
  const color=mt.color;
  const px=i=>padL+(plotW/(n-1))*i;
  const yOf=v=>baseY-(v/niceMax)*plotH;
  let lastData=-1;for(let i=0;i<n;i++)if((values[i]||0)>0&&!buckets[i].future)lastData=i;
  const upTo=lastData<0?0:lastData;
  const labelStep=Math.ceil(n/8);
  const draw=(prog)=>{
    ctx.clearRect(0,0,cssW,cssH);
    ctx.font='9px Outfit,sans-serif';ctx.textBaseline='middle';
    for(let i=0;i<=4;i++){const val=niceMax/4*i,y=baseY-(val/niceMax)*plotH;
      ctx.strokeStyle=grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(cssW-padR,y);ctx.stroke();
      ctx.fillStyle=txt;ctx.textAlign='right';ctx.fillText(fmtShort(val),padL-4,y);}
    const yA=v=>baseY-(baseY-yOf(v))*prog;
    const aPts=[];for(let i=0;i<=upTo;i++)aPts.push([px(i),yA(values[i]||0)]);
    if(aPts.length>1){
      const grad=ctx.createLinearGradient(0,padT,0,baseY);
      grad.addColorStop(0,hexAlpha(color,.32));grad.addColorStop(.55,hexAlpha(color,.1));grad.addColorStop(1,hexAlpha(color,0));
      ctx.beginPath();smoothPath(ctx,aPts);ctx.lineTo(px(upTo),baseY);ctx.lineTo(px(0),baseY);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
      ctx.beginPath();smoothPath(ctx,aPts);ctx.strokeStyle=color;ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.lineCap='round';ctx.setLineDash([]);ctx.stroke();
    }
    const fIdx=Object.keys(fcast.map).map(Number).sort((a,b)=>a-b);
    if(fIdx.length&&lastData>=0){
      const fPts=[[px(lastData),yA(values[lastData]||0)]];
      fIdx.forEach(i=>fPts.push([px(i),yA(fcast.map[i])]));
      ctx.beginPath();smoothPath(ctx,fPts);ctx.strokeStyle=color;ctx.globalAlpha=.5;ctx.lineWidth=2.6;ctx.setLineDash([5,5]);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    // dot at selected period (or last data if empty)
    const dotIdx=(selIdx>=0&&(values[selIdx]||0)>0)?selIdx:upTo;
    if(dotIdx>=0&&(values[dotIdx]||0)>0){const dx=px(dotIdx),dy=yA(values[dotIdx]||0);
      ctx.beginPath();ctx.arc(dx,dy,5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=dark?'#1e1e26':'#fff';ctx.stroke();}
    ctx.textBaseline='alphabetic';ctx.fillStyle=txt;ctx.font='9px Outfit,sans-serif';ctx.textAlign='center';
    for(let i=0;i<n;i++){if(i%labelStep===0||i===n-1)ctx.fillText(buckets[i].label,px(i),cssH-7);}
    if(prog>=1){
      const pts=[];
      for(let i=0;i<=upTo;i++)pts.push({x:px(i),y:yA(values[i]||0),html:`${buckets[i].label}<br><b>${mt.money?fmt(values[i]||0)+' zł':Math.round(values[i]||0)+L3(' klientów',' клиентов',' clients')}</b>`});
      fIdx.forEach(i=>pts.push({x:px(i),y:yA(fcast.map[i]),html:`${buckets[i].label} · ${L3('prognoza','прогноз','forecast')}<br><b>~${mt.money?fmt(fcast.map[i])+' zł':Math.round(fcast.map[i])}</b>`}));
      cv._pts=pts;
    }
  };
  animateChart('_bk'+mt.key,draw);
  attachChartTip(cv);
}


/* chart helpers */
function niceCeil(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;let m;if(n<=1)m=1;else if(n<=2)m=2;else if(n<=5)m=5;else m=10;return m*p}
function cssVar(name,fb){try{const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();return v||fb}catch(e){return fb}}
/* scroll chart scaffold: sticky Y axis + horizontally scrollable plot */
function chartScaffold(host,legendHtml,summaryHtml){
  host.innerHTML=`${legendHtml||''}
    <div style="display:flex;align-items:stretch">
      <canvas class="chart-yaxis" style="flex-shrink:0;display:block"></canvas>
      <div class="chart-scroll" style="flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none">
        <canvas class="chart-plot" style="display:block"></canvas>
      </div>
    </div>${summaryHtml||''}`;

function sizeScrollChart(sc,points,perPoint,cssH){

function drawAxes(d,niceMax,dark){

/* smooth curve through points (Catmull-Rom → bezier); appends to current path */
function smoothPath(ctx,pts){
  if(!pts.length)return;
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    ctx.bezierCurveTo(c1x,c1y,c2x,c2y,p2[0],p2[1]);
  }
}

function hideChartTip(){const el=document.getElementById('chart-tip');if(el)el.style.opacity='0'}
function attachChartTip(cv){
  const handler=ev=>{
    if(!cv._pts||!cv._pts.length)return;
    const rect=cv.getBoundingClientRect();
    const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left;
    let best=null,bd=1e9;
    cv._pts.forEach(p=>{const d=Math.abs(p.x-cx);if(d<bd){bd=d;best=p}});
    if(best&&bd<28){showChartTip(rect.left+best.x,rect.top+best.y,best.html);hap('selection')}
    else hideChartTip();
  };
  cv.addEventListener('touchstart',handler,{passive:true});
  cv.addEventListener('click',handler);
}
function gradBar(ctx,x,y,w,h,color,glow){
  if(h<=0)return;
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,color);g.addColorStop(1,hexAlpha(color,.55));
  if(glow){ctx.save();ctx.shadowColor=hexAlpha(color,.5);ctx.shadowBlur=8}
  ctx.fillStyle=g;roundRect(ctx,x,y,w,h,3);ctx.fill();
  // glossy top highlight
  ctx.fillStyle=hexAlpha('#ffffff',.22);roundRect(ctx,x,y,w,Math.min(h,5),3);ctx.fill();
  if(glow)ctx.restore();
}
function animateChart(key,draw){
  if(window[key])cancelAnimationFrame(window[key]);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){draw(1);return}
  const dur=600,t0=(window.performance&&performance.now())?performance.now():Date.now();
  const tick=()=>{
    const now=(window.performance&&performance.now())?performance.now():Date.now();
    let p=Math.min(1,(now-t0)/dur);
    const e=1-Math.pow(1-p,3); // easeOutCubic
    draw(e);
    if(p<1)window[key]=requestAnimationFrame(tick);else window[key]=null;
  };
  window[key]=requestAnimationFrame(tick);
}

function setupModalSwipe(){
  const handle=document.getElementById('m-handle');
  const sheet=document.getElementById('modal-sheet');
  if(!handle||!sheet)return;

  let startY=0,startT=0,velY=0,lastY=0,isDrag=false,active=false;

  // Swipe on handle OR anywhere in top 60px of sheet
  function shouldCapture(e){
    const t=e.target;
    if(t.closest('input,textarea,button,.mrow,.m-act'))return false;
    const r=sheet.getBoundingClientRect();
    const relY=e.touches[0].clientY-r.top;
    return relY<80||t===handle||t.closest('.m-handle');
  }

  sheet.addEventListener('touchstart',e=>{
    if(!shouldCapture(e))return;
    startY=e.touches[0].clientY;lastY=startY;startT=Date.now();velY=0;active=true;isDrag=false;
  },{passive:true});

  sheet.addEventListener('touchmove',e=>{
    if(!active)return;
    const y=e.touches[0].clientY;
    const dy=y-startY;
    const dt=Math.max(Date.now()-startT,1);
    velY=(y-lastY)/dt*1000;lastY=y;
    if(dy>8&&!isDrag)isDrag=true;
    if(isDrag&&dy>0){
      sheet.style.transition='none';
      sheet.style.transform=`translateX(-50%) translateY(${dy}px)`;
    }
  },{passive:true});

  sheet.addEventListener('touchend',e=>{
    if(!active){active=false;return}
    active=false;
    if(!isDrag){isDrag=false;return}
    isDrag=false;
    const dy=e.changedTouches[0].clientY-startY;
    const momentum=velY*0.12;
    if(dy+momentum>110){
      const remaining=window.innerHeight-e.changedTouches[0].clientY;
      const dur=Math.max(160,Math.min(360,remaining/Math.max(Math.abs(velY),0.5)*1000));
      sheet.style.transition=`transform ${dur}ms cubic-bezier(.4,0,1,1)`;
      sheet.style.transform=`translateX(-50%) translateY(110%)`;
      setTimeout(()=>{
        const scrollY2=parseInt(document.body.style.top||'0')*-1;
        document.body.classList.remove('modal-open');
        document.body.style.top='';
        window.scrollTo(0,scrollY2);
        document.getElementById('modal-bg').classList.remove('open');
        document.getElementById('modal-sheet').classList.remove('open');
        sheet.style.transform='';
      },dur-20);
    } else {
      sheet.style.transition='transform .4s cubic-bezier(.34,1.3,.64,1)';
      sheet.style.transform='translateX(-50%) translateY(0)';
    }
  },{passive:true});
}

const SET_SECS={

function initLocDrag(){
  const list=document.getElementById('loc-set-list');if(!list)return;
  let dragEl=null,ghostEl=null,dragIdx=-1,overIdx=-1,startY=0,longPressTimer=null,isDragging=false;

  function getItemIndex(el){
    const items=list.querySelectorAll('.loc-set-item');
    return Array.from(items).indexOf(el);
  }
  function cleanup(){
    if(ghostEl){ghostEl.remove();ghostEl=null}
    if(dragEl){dragEl.classList.remove('is-dragging')}
    list.querySelectorAll('.loc-set-item').forEach(el=>{el.classList.remove('drag-over-top','drag-over-bot')});
    dragEl=null;dragIdx=-1;overIdx=-1;isDragging=false;
    if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}
  }

  list.querySelectorAll('.loc-drag-handle').forEach((handle,i)=>{
    handle.addEventListener('touchstart',e=>{
      const item=handle.closest('.loc-set-item');
      startY=e.touches[0].clientY;
      longPressTimer=setTimeout(()=>{
        isDragging=true;hap('heavy');
        dragEl=item;dragIdx=getItemIndex(item);
        item.classList.add('is-dragging');
        // Create ghost
        ghostEl=item.cloneNode(true);
        ghostEl.style.cssText=`position:fixed;left:${item.getBoundingClientRect().left}px;top:${item.getBoundingClientRect().top}px;width:${item.offsetWidth}px;opacity:.85;pointer-events:none;z-index:9999;border-radius:var(--r-md);box-shadow:var(--sh-xl);background:var(--card);transform:scale(1.03);transition:none;`;
        document.body.appendChild(ghostEl);
      },350);
    },{passive:true});

    handle.addEventListener('touchmove',e=>{
      if(!isDragging){if(Math.abs(e.touches[0].clientY-startY)>8){clearTimeout(longPressTimer);longPressTimer=null}return}
      e.preventDefault();
      const y=e.touches[0].clientY;
      if(ghostEl){ghostEl.style.top=(y-30)+'px'}
      // Find which item we're over
      const items=Array.from(list.querySelectorAll('.loc-set-item:not(.is-dragging)'));
      list.querySelectorAll('.loc-set-item').forEach(el=>el.classList.remove('drag-over-top','drag-over-bot'));
      let newOver=-1;
      items.forEach((el,j)=>{
        const r=el.getBoundingClientRect();
        const mid=r.top+r.height/2;
        if(y<mid&&newOver===-1){newOver=getItemIndex(el);el.classList.add('drag-over-top')}
      });
      if(newOver===-1&&items.length){
        const last=items[items.length-1];newOver=getItemIndex(last)+1;last.classList.add('drag-over-bot')
      }
      if(newOver!==overIdx){hap('selection');overIdx=newOver}
    },{passive:false});

    handle.addEventListener('touchend',()=>{
      clearTimeout(longPressTimer);longPressTimer=null;
      if(!isDragging){cleanup();return}
      if(dragIdx>=0&&overIdx>=0&&overIdx!==dragIdx){
        const arr=[...locs];
        const item=arr.splice(dragIdx,1)[0];
        const insertAt=overIdx>dragIdx?overIdx-1:overIdx;
        arr.splice(Math.max(0,Math.min(arr.length,insertAt)),0,item);
        locs=arr;saveAll();
      }
      hap('medium');cleanup();renderLocGrid();renderLocSettings();
    },{passive:true});
  });
}

function initLocSwipeDelete(){
  const list=document.getElementById('loc-set-list');if(!list)return;
  list.querySelectorAll('.loc-set-item').forEach(item=>{
    let sx=0,sy=0,tx=0;
    item.addEventListener('touchstart',e=>{
      if(e.target.closest('.loc-drag-handle,.loc-del,.loc-chev,.loc-emoji-input,.loc-reform-toggle,.loc-color-btn,.loc-name-input'))return;
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;tx=0;
    },{passive:true});
    item.addEventListener('touchmove',e=>{
      if(e.target.closest('.loc-drag-handle,.loc-del,.loc-chev,.loc-emoji-input,.loc-reform-toggle,.loc-color-btn,.loc-name-input'))return;
      const dx=e.touches[0].clientX-sx;
      const dy=Math.abs(e.touches[0].clientY-sy);
      if(dy>Math.abs(dx)+8)return;
      if(item.classList.contains('swiped')){if(dx>20){item.classList.remove('swiped');item.style.transform=''}return}
      if(dx<-5){tx=Math.max(-80,dx);item.style.transition='none';item.style.transform='translateX('+tx+'px)'}
    },{passive:true});
    item.addEventListener('touchend',()=>{
      item.style.transition='';
      if(tx<-40){item.classList.add('swiped');item.style.transform=''}
      else{item.classList.remove('swiped');item.style.transform=''}
      tx=0;
    },{passive:true});
  });
}

function firstGrapheme(s){
  s=String(s||'');if(!s)return'';
  try{if(window.Intl&&Intl.Segmenter){const it=new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)[Symbol.iterator]().next();return it.done?'':it.value.segment}}catch(e){}
  return Array.from(s)[0]||'';
}
function locIconInput(i,el){
  const g=firstGrapheme(el.value.trim());if(!g)return;
  el.value=g;locs[i].icon=g;saveAll();locsChanged();hap('light');el.blur();

/* custom colour: the native picker stays open while the finger drags; nothing is re-rendered until Done / tap outside */

async function exportSmart(){
  const data={entries,locs,settings,lang,appName,clients,dayOffDates,v:5,exportedAt:new Date().toISOString()};
  const json=JSON.stringify(data,null,2);
  const filename=`${appName.toLowerCase().replace(/\s+/g,'-')}-backup-${todayStr()}.json`;

  // Try Web Share API with File (works on iOS Safari 15+)
  if(navigator.share && navigator.canShare){
    try{
      const file=new File([json],filename,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:filename});
        backupDone();return;
      }
    }catch(e){
      if(e.name==='AbortError')return; // user cancelled — that's fine
      // fall through to next method
    }
  }

  // Try Web Share API text only (older iOS)
  if(navigator.share){
    try{
      await navigator.share({title:filename,text:json});
      backupDone();return;
    }catch(e){
      if(e.name==='AbortError')return;
    }
  }

  // Desktop / Android: standard blob download
  fallbackExport(json,filename);backupDone();
}
function fallbackExport(json,filename){
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},300);
  showToast(L3('Eksport gotowy','Экспорт готов','Export ready'));
}
function exportData(){exportSmart();}

function bkGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function bkSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function bkDays(){
  const t=Date.parse(bkGet('bLastBackup')||'');if(!isFinite(t))return null;
  const a=new Date(todayStr()+'T12:00:00'),b=new Date(new Date(t).getFullYear(),new Date(t).getMonth(),new Date(t).getDate(),12);
  return Math.max(0,Math.round((a-b)/86400000));
}
function bkWhen(){
  const d=bkDays(),V=T.svc;
  if(d===null)return V.bkNever;
  return d===0?V.bkToday:d===1?V.bkYest:V.bkDaysAgo.replace('{n}',d);
}
function backupDone(){bkSet('bLastBackup',new Date().toISOString());bkSet('bBkSnooze','');showToast(T.svc.bkDone);renderBackupInfo()}
function backupLater(){bkSet('bBkSnooze',String(Date.now()+3*86400000));hap('light');renderBackupInfo()}
function renderBackupInfo(){
  const V=T.svc,d=bkDays();
  const sub=document.getElementById('sl-exp-s');
  if(sub)sub.textContent=(d===null?V.bkNever:V.bkLast+': '+bkWhen())+' · '+V.bkSub;
  const host=document.getElementById('bk-banner');if(!host)return;
  const snooze=Number(bkGet('bBkSnooze'))||0;

  host.innerHTML=stale?`<div class="bk-ban"><div style="font-size:22px">💾</div>
    <div class="bk-t">${d===null?V.bkNever:V.bkAgo.replace('{n}',d)}<small>${V.bkHint}</small></div>

    <button class="bk-x" onclick="backupLater()" aria-label="${V.bkLater}">✕</button></div>`:'';
}

function importData(ev){
  const file=ev.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.entries)entries=d.entries;if(d.locs)locs=d.locs;
      if(d.settings)settings=d.settings;applyLook();if(d.lang)lang=d.lang;if(d.appName)appName=d.appName;
      if(d.clients){clients=d.clients;saveClients();}
      if(d.dayOffDates){dayOffDates=d.dayOffDates;saveDayOff();}
      T=TR[lang];saveAll();applyLang();locsChanged();

      bkSet('bLastBackup',new Date().toISOString());renderBackupInfo();

}

function roundRect(ctx,x,y,w,h,r){
  if(h<=0)return;if(h<r)r=h;
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h);
  ctx.lineTo(x,y+h);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}
function fmtShort(n){
  if(n>=1000)return(n/1000).toFixed(1).replace('.',',')+' k';
  return Math.round(n)+'';
}

/* ══ Earnings per hour by location (my % + tips, over the hours actually worked) ══ */
function hourlyData(ents){
  const rows=locs.map(l=>{
    const le=ents.filter(e=>e.locId===l.id&&(+e.hours||0)>0);
    const h=le.reduce((a,e)=>a+(+e.hours||0),0),inc=le.reduce((a,e)=>a+(e.realTotal!=null?e.realTotal:(e.total||0)),0);
    return{l,h,inc,rate:h>0?inc/h:0};
  }).filter(r=>r.h>0).sort((a,b)=>b.rate-a.rate);
  const H=rows.reduce((a,r)=>a+r.h,0),I=rows.reduce((a,r)=>a+r.inc,0);
  return{rows,avg:H>0?I/H:0,H};
}
function hourlyHtml(ents,wrapId){
  const d=hourlyData(ents);if(!d.rows.length)return'';
  const V=T.svc,max=Math.max(...d.rows.map(r=>r.rate))||1;
  const body=d.rows.map((r,i)=>`<div style="padding:10px 16px;${i<d.rows.length-1?'border-bottom:1px solid var(--sep)':''}">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
        <span style="width:9px;height:9px;border-radius:50%;background:${r.l.color};flex:none;align-self:center"></span>
        <span style="font-size:14.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.l.icon} ${apEsc(r.l.name.split(' ')[0])}</span>
        <b style="font-size:16px">${Math.round(r.rate)} <span style="font-size:11px;color:var(--t3);font-weight:700">${V.hourU}</span></b></div>
      <div style="height:6px;border-radius:3px;background:var(--bg2);overflow:hidden"><div style="height:100%;width:${Math.max(4,r.rate/max*100)}%;background:${r.l.color};border-radius:3px"></div></div>
      <div style="font-size:11.5px;color:var(--t3);font-weight:600;margin-top:5px">${fmt(r.inc)} zł ${V.hourOf} ${fmtH(r.h)} ${T.svc.hUnit||'h'}</div></div>`).join('');
  return`<div class="slabel" style="margin-top:16px;display:flex;justify-content:space-between"><span>${V.hourT}</span><span style="text-transform:none;letter-spacing:0">${V.hourAvg} ${Math.round(d.avg)} ${V.hourU}</span></div>
    <div class="card" style="margin-bottom:12px;padding:4px 0">${body}</div>`;
}

/* Avatar color from name */
function avatarColor(name){
  const COLS=['#2563eb','#16a34a','#ea580c','#7c3aed','#0891b2','#be185d','#b45309','#0d9488'];
  let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%COLS.length;
  return COLS[Math.abs(h)%COLS.length];
}
function avatarInitials(first,last){
  return((first?.[0]||'')+(last?.[0]||'')).toUpperCase()||'?';
}

function renderClientList(){
  const q=(document.getElementById('cl-search')?.value||'').toLowerCase().trim();
  const el=document.getElementById('cl-list');if(!el)return;

  let filtered=q
    ? clients.filter(cl=>{
        const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
        const fullN=norm(cl.first+' '+cl.last);
        const firstN=norm(cl.first);
        const lastN=norm(cl.last);
        const qN=norm(q);
        const phone=(cl.phone||'').replace(/\D/g,'');
        const qPhone=q.replace(/\D/g,'');
        return fullN.includes(qN)||firstN.includes(qN)||lastN.includes(qN)||
               (qPhone.length>0&&phone.includes(qPhone));
      })
    : [...clients];

  // Sort: alphabetically by last name then first
  filtered.sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first,'pl'));

  if(!filtered.length){
    el.innerHTML=`<div class="cl-empty">
      <div class="cl-empty-icon">👤</div>
      <div class="cl-empty-txt">${q?T.cl.notFound:T.cl.noClients}</div>
      <div class="cl-empty-sub">${q?'':T.cl.addHint}</div>
    </div>`;
    return;
  }

  // Group by first letter of last name
  const groups={};
  filtered.forEach(cl=>{
    const letter=(cl.last?.[0]||cl.first?.[0]||'#').toUpperCase();
    if(!groups[letter])groups[letter]=[];
    groups[letter].push(cl);
  });

  let html='';
  // Stats bar
  html+=`<div style="padding:0 4px 8px;font-size:12px;color:var(--t3);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px"><span>${filtered.length} ${T.cl.count}</span></div>`;

  Object.keys(groups).sort().forEach(letter=>{
    html+=`<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);padding:0 4px;margin-bottom:6px;margin-top:${letter===Object.keys(groups).sort()[0]?'0':'14px'}">${letter}</div>`;
    groups[letter].forEach(cl=>{
      const col=avatarColor(cl.first+cl.last);
      const ini=avatarInitials(cl.first,cl.last);
      const locName=cl.locId?locs.find(l=>l.id===cl.locId)?.name?.split(' ')[0]||'':'';
      const locColor=cl.locId?locs.find(l=>l.id===cl.locId)?.color||'#888':'#888';
      const tags=[];
      if(cl.haircut)tags.push(`<span class="cl-tag">✂️ ${cl.haircut}</span>`);
      if(locName)tags.push(`<span class="cl-tag loc" style="background:${locColor}">${locName}</span>`);
      {const bk=bdDays(cl,new Date());if(bk!==null&&bk<=7)tags.push(`<span class="cl-tag" style="background:var(--ol);color:var(--orange)">🎂 ${bk===0?L3('dziś','сегодня','today'):String(bdParse(cl).d).padStart(2,'0')+'.'+p2(bdParse(cl).m+1)}</span>`)}
      html+=`<div class="cl-card" onclick="openClientForm(${cl.id})">
        <div class="cl-card-top">
          <div class="cl-avatar" style="background:${col}">${ini}</div>
          <div style="flex:1;min-width:0">
            <div class="cl-name">${cl.first} ${cl.last}</div>
            ${ cl.phone ? `<div class='cl-phone'>📞 ${cl.phone}</div>` : '' }

        </div>
        ${tags.length?`<div class="cl-tags">${tags.join('')}</div>`:''}
      </div>`;
    });
  });
  el.innerHTML=html;
}

/* Search all entries' free-text notes for mentions of this client's name.
   Entries aggregate a whole day+location (not a single client visit), so this is
   NOT a guaranteed visit log — just the one real per-client signal that exists
   in the data today (notes like "22.03 na zero Piotr Marciniak"). */
function findClientMentions(cl){
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const first=norm(cl.first||'');
  const last=norm(cl.last||'');
  if(!first&&!last)return[];
  return entries.filter(e=>{
    if(!e.notes)return false;
    const n=norm(e.notes);
    return(first&&n.includes(first))||(last&&n.includes(last));
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

/* ══ Monthly goal + forecast ══ */
function gf(n){return Math.round(n).toLocaleString('pl-PL')}
function goalPersonal(ents){return S(ents,'myPctAmt')+S(ents,'tips')+S(ents,'tipsCash')}
function goalMonthEnts(y,m){const pf=y+'-'+p2(m+1);return entries.filter(e=>e.date.startsWith(pf)&&isReal(e))}
function goalAvg3(){
  const n=new Date(todayStr()+'T12:00:00');const vals=[];
  for(let k=1;k<=3;k++){const d=new Date(n.getFullYear(),n.getMonth()-k,1);const e=goalMonthEnts(d.getFullYear(),d.getMonth());if(e.length)vals.push(goalPersonal(e))}
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
}
function goalRemain(wD,ents){
  const ts=todayStr(),n=new Date(ts+'T12:00:00'),pf=ts.slice(0,7);
  const dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),dayNum=n.getDate();
  const hasToday=ents.some(e=>e.date===ts);
  let futOff=0;for(let d=dayNum+1;d<=dim;d++)if(isDayOff(`${pf}-${p2(d)}`))futOff++;
  const wDnow=new Set(ents.filter(e=>e.date<=ts).map(e=>e.date)).size;
  const est=wDnow>0?Math.round(wDnow/dayNum*(dim-dayNum)):0;
  return{rem:Math.max(0,est-futOff),src:'pace'};
}
function goalCardHtml(earned,wD,ents){

  if(!g){
    if(!cur)return'';

/* ══ Insights: weekdays and locations ══ */
let _anaP='3m';
function anaSetP(p){_anaP=p;hap('light');renderAnalytics()}
function anaEnts(){
  const ts=todayStr(),t=new Date(ts+'T12:00:00');
  let from='0000-00-00';
  if(_anaP==='3m'){t.setDate(t.getDate()-90);from=t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())}
  else if(_anaP==='12m'){t.setDate(t.getDate()-365);from=t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())}
  return entries.filter(e=>isReal(e)&&e.date>=from&&e.date<=ts);
}
function anaInc(e){return e.realTotal!=null?e.realTotal:(e.total||0)}
function anaCalc(ents){
  const days={};
  ents.forEach(e=>{const d=days[e.date]||(days[e.date]={inc:0,h:0,cl:0});d.inc+=anaInc(e);d.h+=(+e.hours||0);d.cl+=(+e.clients||0)});
  const dow=Array.from({length:7},()=>({n:0,inc:0,h:0,cl:0}));
  Object.keys(days).forEach(ds=>{const i=(new Date(ds+'T12:00:00').getDay()+6)%7,d=days[ds],o=dow[i];o.n++;o.inc+=d.inc;o.h+=d.h;o.cl+=d.cl});
  dow.forEach(o=>{o.avg=o.n?o.inc/o.n:0;o.rate=o.h>0?o.inc/o.h:0});
  const rel=dow.map((o,i)=>({o,i})).filter(x=>x.o.n>=3);
  let best=-1,weak=-1;
  if(rel.length>=2){best=rel.reduce((a,x)=>x.o.avg>a.o.avg?x:a).i;weak=rel.reduce((a,x)=>x.o.avg<a.o.avg?x:a).i;if(best===weak)weak=-1}
  const L=locs.map(l=>{
    const le=ents.filter(e=>e.locId===l.id);
    const inc=le.reduce((a,e)=>a+anaInc(e),0),hh=le.reduce((a,e)=>a+(+e.hours||0),0),cl=le.reduce((a,e)=>a+(+e.clients||0),0);
    const nd=new Set(le.map(e=>e.date)).size;
    return{l,inc,h:hh,cl,nd,rate:hh>0?inc/hh:0,per:cl>0?inc/cl:0,day:nd?inc/nd:0};
  }).filter(r=>r.nd>0).sort((a,b)=>b.inc-a.inc);
  return{dow,best,weak,L,total:L.reduce((a,r)=>a+r.inc,0),nDays:Object.keys(days).length};
}
/* ── hours report: weekday × location (zł/h) + time of day from appointments ── */
function anaHeat(ents){
  const cell={};
  ents.forEach(e=>{
    const i=(new Date(e.date+'T12:00:00').getDay()+6)%7,k=e.locId+'|'+i,c=cell[k]||(cell[k]={inc:0,h:0,d:new Set()});
    c.inc+=anaInc(e);c.h+=(+e.hours||0);c.d.add(e.date);
  });
  const rows=[];let all=[];
  locs.forEach(l=>{
    const r={l,c:[]};let any=false;
    for(let i=0;i<7;i++){
      const c=cell[l.id+'|'+i];
      if(c&&c.h>0&&c.d.size>=2){const rate=c.inc/c.h;r.c.push({rate,n:c.d.size});all.push({l,i,rate,n:c.d.size});any=true}
      else r.c.push(null);
    }
    if(any)rows.push(r);
  });
  let best=null,weak=null;
  if(all.length>=2){best=all.reduce((a,x)=>x.rate>a.rate?x:a);weak=all.reduce((a,x)=>x.rate<a.rate?x:a);if(best===weak)weak=null}
  return{rows,best,weak,max:Math.max(1,...all.map(x=>x.rate))};
}

/* ══ Year over year ══ */
function monthPersonal(y,m){const pre=y+'-'+p2(m+1);return entries.filter(e=>isReal(e)&&String(e.date).startsWith(pre)).reduce((a,e)=>a+(+e.myPctAmt||0)+(+e.tips||0)+(+e.tipsCash||0),0)}
function yoyData(now){
  const y=now.getFullYear(),cm=now.getMonth(),cur=[],prev=[];
  for(let m=0;m<12;m++){cur.push(m<=cm?monthPersonal(y,m):0);prev.push(monthPersonal(y-1,m))}
  const ytd=cur.slice(0,cm+1).reduce((a,b)=>a+b,0),pytd=prev.slice(0,cm+1).reduce((a,b)=>a+b,0);
  const hasPrev=prev.some(v=>v>0);
  return{y,cm,cur,prev,ytd,pytd,hasPrev,mCur:cur[cm],mPrev:prev[cm]};
}
function anaYoyHtml(){
  const D=yoyData(new Date()),ttl=L3('Rok do roku','Год к году','Year over year');

  }
  const pc=(a,b)=>b>0?Math.round((a-b)/b*100):null,pm=pc(D.ytd,D.pytd),mm=pc(D.mCur,D.mPrev);
  const tag=v=>v===null?'':`<b style="color:${v>=0?'var(--green)':'var(--red)'}">${v>=0?'+':'−'}${Math.abs(v)}%</b>`;

   <div style="flex:1;background:var(--bg2);border-radius:14px;padding:10px 12px"><div style="font-size:11px;color:var(--t3);font-weight:700">${TDMONN[lang][D.cm]}</div><div style="font-size:17px;font-weight:800">${fmtZl(Math.round(D.mCur))}</div><div style="font-size:12px;color:var(--t2)">${D.y-1}: ${fmtZl(Math.round(D.mPrev))} ${tag(mm)}</div></div>

   <div style="display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11.5px;color:var(--t2);font-weight:600"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--sep);box-shadow:inset 0 0 0 1px var(--t3);margin-right:5px"></i>${D.y-1}</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--blue);margin-right:5px"></i>${D.y}</span></div></div>`;

/* ══ Search ══ */
const _nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function openSearch(){
  sheetShow(L3('Szukaj','Поиск','Search'),`<div class="mf-wrap"><input id="sr-q" class="sr-in" type="search" autocomplete="off" autocorrect="off" placeholder="${apEsc(L3('Klient, telefon, usługa, notatka…','Клиент, телефон, услуга, заметка…','Client, phone, service, note…'))}" oninput="srRun()"><div id="sr-out"><div class="sr-e">${apEsc(L3('Zacznij pisać','Начни вводить','Start typing'))}</div></div></div>`);
  setTimeout(()=>{const i=document.getElementById('sr-q');if(i)i.focus()},320);
}
function srFind(q){
  const n=_nrm(q.trim());if(n.length<2)return null;
  const has=(...xs)=>xs.some(x=>_nrm(x).includes(n));const dig=q.replace(/\D/g,'');
  const cl=clients.filter(c=>has(c.first+' '+(c.last||''),c.haircut,c.prefs,c.notes)||(dig.length>2&&String(c.phone||'').replace(/\D/g,'').includes(dig))).slice(0,6);
  const en=entries.filter(e=>isReal(e)&&e.notes&&has(e.notes)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return{cl,en};
}
function srRun(){
  const q=document.getElementById('sr-q').value,o=document.getElementById('sr-out'),r=srFind(q);
  if(!r){o.innerHTML=`<div class="sr-e">${apEsc(L3('Zacznij pisać','Начни вводить','Start typing'))}</div>`;return}
  if(!r.cl.length&&!r.en.length){o.innerHTML=`<div class="sr-e">${apEsc(L3('Nic nie znaleziono','Ничего не найдено','Nothing found'))}</div>`;return}

(function(){
  const sel='button[data-ds]';
  const tgt=e=>e.target&&e.target.closest?e.target.closest(sel):null;
  function start(e){const b=tgt(e);if(!b)return;const p=e.touches?e.touches[0]:e;_lp.x=p.clientX;_lp.y=p.clientY;_lp.ds=b.dataset.ds;clearTimeout(_lp.t);
    _lp.pend='';_lp.t=setTimeout(()=>{_lp.t=null;_lp.pend=_lp.ds;hap('medium');offSelEnter()},480)}
  function move(e){if(!_lp.t)return;const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-_lp.x)>9||Math.abs(p.clientY-_lp.y)>9){clearTimeout(_lp.t);_lp.t=null}}
  /* the day is toggled on release, so the calendar is not re-rendered under the finger */
  function end(){clearTimeout(_lp.t);_lp.t=null;if(_lp.pend){const d=_lp.pend;_lp.pend='';_lp.at=Date.now();offSelToggle(d)}}
  document.addEventListener('touchstart',start,{passive:true});document.addEventListener('touchmove',move,{passive:true});
  document.addEventListener('touchend',end);document.addEventListener('touchcancel',end);
  document.addEventListener('mousedown',start);document.addEventListener('mouseup',end);document.addEventListener('mouseleave',end);
  document.addEventListener('click',e=>{const b=tgt(e);if(!b)return;
    if(_lp.pend||Date.now()-_lp.at<350){e.preventDefault();e.stopPropagation();return}
    if(_offSel){e.preventDefault();e.stopPropagation();offSelToggle(b.dataset.ds)}
  },true);
  document.addEventListener('contextmenu',e=>{if(tgt(e))e.preventDefault()});
})();

function odoSet(el,newVal,dir){
  if(!el)return;
  const cur=el.textContent||'0';
  if(cur===newVal)return;
  const wrap=document.createElement('div');
  wrap.className='odo-wrap';
  const inner=document.createElement('div');
  inner.className='odo-inner';
  // dir: 1=forward(up), -1=back(down)
  inner.style.transform=dir>0?'translateY(0)':'translateY(-50%)';
  const t1=document.createElement('span');t1.textContent=dir>0?cur:newVal;
  const t2=document.createElement('span');t2.textContent=dir>0?newVal:cur;
  inner.appendChild(t1);inner.appendChild(t2);
  wrap.appendChild(inner);
  el.innerHTML='';el.appendChild(wrap);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      inner.style.transform=dir>0?'translateY(-50%)':'translateY(0)';
    });
  });
}
